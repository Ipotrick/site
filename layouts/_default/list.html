{{ define "main" }}
<main class="page">
	<section class="card">
		<h1 class="page-title">{{ .Title }}</h1>
		<ul class="post-list">
			{{- range .Pages }}
			<li>
				<a href="{{ .RelPermalink }}"><span class="post-title">{{ .Title }}</span><span class="post-date">{{ .Date.Format "Jan 2, 2006" }}</span></a>
			</li>
			{{- end }}
		</ul>
	</section>
</main>
{{ end }}
