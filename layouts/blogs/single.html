{{ define "main" }}
<main class="page post-page">
	<div class="post-layout{{ if .Fragments.Headings }} has-toc{{ end }}">
		{{- if .Fragments.Headings }}
		<aside class="toc-col">
			<details class="toc" open>
				<summary>Contents</summary>
				{{ .TableOfContents }}
			</details>
		</aside>
		{{- end }}
		<article class="card post">
			<header class="post-header">
				<h1 class="post-heading">{{ .Title }}</h1>
				<p class="post-meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>{{ with site.Params.author.name }} · {{ . }}{{ end }}</p>
			</header>
			<div class="content">
				{{ .Content }}
			</div>
		</article>
	</div>
</main>
<script>
	(function () {
		var toc = document.querySelector('.toc');
		if (!toc) return;
		if (!window.matchMedia('(min-width: 1100px)').matches) toc.removeAttribute('open');
		var links = {};
		toc.querySelectorAll('nav a[href^="#"]').forEach(function (a) { links[decodeURIComponent(a.getAttribute('href').slice(1))] = a; });
		var headings = Array.prototype.filter.call(document.querySelectorAll('.content h2[id], .content h3[id]'), function (h) { return links[h.id]; });
		if (!('IntersectionObserver' in window) || !headings.length) return;
		var current = null;
		var observer = new IntersectionObserver(function (entries) {
			entries.forEach(function (e) {
				if (!e.isIntersecting) return;
				if (current) current.classList.remove('active');
				current = links[e.target.id];
				current.classList.add('active');
			});
		}, { rootMargin: '0px 0px -75% 0px' });
		headings.forEach(function (h) { observer.observe(h); });
	})();
</script>
{{ end }}
