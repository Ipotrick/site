{{ define "main" }}
<main class="page">
	<section class="card">
		<h1 class="page-title">{{ .Title }}</h1>
		{{- range .Pages.GroupByDate "2006" "desc" }}
		<div class="year-group">
			<h2 class="year" id="{{ .Key }}">{{ .Key }}</h2>
			{{- range .Pages.GroupByDate "January" "desc" }}
			<h3 class="month">{{ .Key }}</h3>
			<ul class="post-list">
				{{- range .Pages }}
				<li>
					<a href="{{ .RelPermalink }}"><span class="post-title">{{ .Title }}</span><span class="post-date">{{ .Date.Format "Jan 2" }}</span></a>
				</li>
				{{- end }}
			</ul>
			{{- end }}
		</div>
		{{- end }}
	</section>
</main>
{{ end }}
