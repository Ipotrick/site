<header class="site-header">
	<div class="site-header-inner">
		<a class="site-title" href="{{ "" | relURL }}">{{ site.Title }}</a>
		<nav class="site-nav">
			{{- range site.Menus.main }}
			<a href="{{ .URL | relURL }}"{{ if $.HasMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
			{{- end }}
		</nav>
	</div>
</header>
