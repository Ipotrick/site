# Manual semantic colours for code blocks. Tag a fenced block with {colors=<set>} and every
# identifier listed in that set is coloured with the diagram palette (--chart-categorical-N),
# so resources in the code match their rows in the diagrams. Colours are per diagram, not global.
#
# example = the example frame: matches diagram 07's resource rows.
[example]
light_list = 1
shadow_maps = 2
froxels = 3
gbuffer = 4
ao = 5
ao_denoised = 6
hdr = 7
