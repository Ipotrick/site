<svg viewBox="0 0 760 440" role="img" aria-label="Every change of access on a timeline becomes one barrier" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" width="760" height="440"><style>svg{--chart-categorical-1:rgb(42, 120, 214);--chart-categorical-2:rgb(235, 104, 52);--chart-axis:rgb(195, 194, 183);--text-primary:rgb(11, 11, 11);--text-secondary:rgb(82, 81, 78);--chart-grid:rgba(11,11,11,0.1)}@media (prefers-color-scheme:dark){svg{--chart-categorical-1:rgb(57, 135, 229);--chart-categorical-2:rgb(217, 89, 38);--chart-axis:rgb(56, 56, 53);--text-primary:rgb(240, 239, 236);--text-secondary:rgb(195, 194, 183);--chart-grid:rgba(255,255,255,0.1)}}</style><defs><marker id="dep-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill: var(--chart-categorical-1);"></path></marker><marker id="dep-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill: var(--chart-categorical-2);"></path></marker><marker id="down-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill: var(--chart-axis);"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" style="fill: var(--text-primary);">Barriers from the timelines, in recording order</text><text x="24" y="50" font-size="11.5" style="fill: var(--text-secondary);">Passes in recording order. W = write, R = read.</text><text x="24" y="104" style="fill: var(--text-secondary);">Passes</text><line x1="260" x2="260" y1="116" y2="149" stroke-dasharray="3 3" style="stroke: var(--chart-grid);"></line><line x1="380" x2="380" y1="116" y2="149" stroke-dasharray="3 3" style="stroke: var(--chart-grid);"></line><line x1="500" x2="500" y1="116" y2="193" stroke-dasharray="3 3" style="stroke: var(--chart-grid);"></line><line x1="620" x2="620" y1="116" y2="149" stroke-dasharray="3 3" style="stroke: var(--chart-grid);"></line><line x1="160" x2="736" y1="164" y2="164" stroke-width="2" style="stroke: var(--chart-grid);"></line><line x1="160" x2="736" y1="208" y2="208" stroke-width="2" style="stroke: var(--chart-grid);"></line><text x="24" y="168" style="fill: var(--text-primary);">depth</text><text x="24" y="212" style="fill: var(--text-primary);">hiz</text><g><rect x="220" y="84" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="340" y="84" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="460" y="84" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="580" y="84" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><text x="260" y="105" text-anchor="middle" style="fill: var(--text-primary);">GBuf</text><text x="380" y="105" text-anchor="middle" style="fill: var(--text-primary);">HiZ</text><text x="500" y="105" text-anchor="middle" style="fill: var(--text-primary);">Cull</text><text x="620" y="105" text-anchor="middle" style="fill: var(--text-primary);">Water</text></g><g fill="none" stroke-width="1.5"><path d="M276 164H363" marker-end="url(#dep-a)" style="stroke: var(--chart-categorical-1);"></path><path d="M396 164H603" marker-end="url(#dep-a)" style="stroke: var(--chart-categorical-1);"></path><path d="M396 208H483" marker-end="url(#dep-b)" style="stroke: var(--chart-categorical-2);"></path></g><g><circle cx="260" cy="164" r="15" fill-opacity="0.15" stroke-width="1.5" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></circle><circle cx="380" cy="164" r="15" fill-opacity="0.15" stroke-width="1.5" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></circle><circle cx="620" cy="164" r="15" fill-opacity="0.15" stroke-width="1.5" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></circle><text x="260" y="168" text-anchor="middle" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">W</text><text x="380" y="168" text-anchor="middle" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">R</text><text x="620" y="168" text-anchor="middle" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">W</text><circle cx="380" cy="208" r="15" fill-opacity="0.15" stroke-width="1.5" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></circle><circle cx="500" cy="208" r="15" fill-opacity="0.15" stroke-width="1.5" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></circle><text x="380" y="212" text-anchor="middle" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">W</text><text x="500" y="212" text-anchor="middle" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">R</text></g><g fill="none" stroke-width="1.25" stroke-dasharray="4 4" style="stroke: var(--chart-axis);"><path d="M292 164C320 164 320 164 320 192V254"></path><path d="M412 208C440 208 440 208 440 236V254"></path><path d="M532 164C560 164 560 164 560 192V254"></path></g><text x="24" y="266" style="fill: var(--text-secondary);">Barriers</text><g><path d="M320 254l8 8l-8 8l-8 -8z" style="fill: var(--chart-axis);"></path><path d="M440 254l8 8l-8 8l-8 -8z" style="fill: var(--chart-axis);"></path><path d="M560 254l8 8l-8 8l-8 -8z" style="fill: var(--chart-axis);"></path><text x="330" y="292" text-anchor="start" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">depth: W → R</text><text x="330" y="308" text-anchor="start" font-size="11.5" style="fill: var(--text-secondary);">HiZ waits on GBuf</text><text x="450" y="292" text-anchor="start" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">hiz: W → R</text><text x="450" y="308" text-anchor="start" font-size="11.5" style="fill: var(--text-secondary);">Cull waits on HiZ</text><text x="570" y="292" text-anchor="start" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">depth: R → W</text><text x="570" y="308" text-anchor="start" font-size="11.5" style="fill: var(--text-secondary);">Water waits on HiZ</text></g><g fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"><path d="M320 270V352" marker-end="url(#down-arrow)"></path><path d="M440 270V352" marker-end="url(#down-arrow)"></path><path d="M560 270V352" marker-end="url(#down-arrow)"></path></g><text x="24" y="376" style="fill: var(--text-secondary);">Final order</text><g><rect x="220" y="356" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="340" y="356" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="460" y="356" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="580" y="356" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="315" y="356" width="10" height="32" rx="3" style="fill: var(--chart-axis);"></rect><rect x="435" y="356" width="10" height="32" rx="3" style="fill: var(--chart-axis);"></rect><rect x="555" y="356" width="10" height="32" rx="3" style="fill: var(--chart-axis);"></rect><text x="260" y="377" text-anchor="middle" style="fill: var(--text-primary);">GBuf</text><text x="380" y="377" text-anchor="middle" style="fill: var(--text-primary);">HiZ</text><text x="500" y="377" text-anchor="middle" style="fill: var(--text-primary);">Cull</text><text x="620" y="377" text-anchor="middle" style="fill: var(--text-primary);">Water</text></g><text x="24" y="420" font-size="11.5" style="fill: var(--text-secondary);">Each barrier sits as late as possible, right before the first pass of the new access.</text></svg>