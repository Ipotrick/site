<svg viewBox="0 0 760 440" role="img" aria-label="Same batches, but moving the cloud passes later lets clouds alias the gbuffer" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" width="760" height="440"><style>svg{--chart-axis:rgb(195, 194, 183);--text-primary:rgb(11, 11, 11);--text-secondary:rgb(82, 81, 78);--chart-grid:rgba(11,11,11,0.1);--chart-categorical-2:rgb(235, 104, 52);--chart-categorical-1:rgb(42, 120, 214);--chart-status-good:rgb(12, 163, 12)}@media (prefers-color-scheme:dark){svg{--chart-axis:rgb(56, 56, 53);--text-primary:rgb(240, 239, 236);--text-secondary:rgb(195, 194, 183);--chart-grid:rgba(255,255,255,0.1);--chart-categorical-2:rgb(217, 89, 38);--chart-categorical-1:rgb(57, 135, 229);--chart-status-good:rgb(12, 163, 12)}}</style><defs><marker id="ba-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill: var(--chart-axis);"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" style="fill: var(--text-primary);">Moving the cloud passes later</text><text x="24" y="50" font-size="11.5" style="fill: var(--text-secondary);">GBuf writes gbuffer, Light reads it. Clouds writes clouds_raw, CloudUp reads it and writes clouds, Post reads clouds.</text><g><line x1="355" x2="355" y1="86" y2="426" style="stroke: var(--chart-grid);"></line><line x1="465" x2="465" y1="86" y2="426" style="stroke: var(--chart-grid);"></line><line x1="575" x2="575" y1="86" y2="426" style="stroke: var(--chart-grid);"></line><text x="300" y="82" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">Batch 0</text><text x="410" y="82" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">Batch 1</text><text x="520" y="82" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">Batch 2</text><text x="630" y="82" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">Batch 3</text></g><g><g><g fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"><path d="M340 120H370" marker-end="url(#ba-arrow)"></path><path d="M450 120H480" marker-end="url(#ba-arrow)"></path><path d="M560 120H590" marker-end="url(#ba-arrow)"></path><path d="M340 164H370" marker-end="url(#ba-arrow)"></path><path d="M450 164H630V135" marker-end="url(#ba-arrow)"></path></g><rect x="260" y="105" width="80" height="30" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="370" y="105" width="80" height="30" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="480" y="105" width="80" height="30" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="590" y="105" width="80" height="30" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="260" y="149" width="80" height="30" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="370" y="149" width="80" height="30" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="252" y="192" width="206" height="12" rx="6" fill-opacity="0.25" stroke-width="1.25" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><rect x="252" y="210" width="206" height="12" rx="6" fill-opacity="0.25" stroke-width="1.25" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><rect x="362" y="228" width="316" height="12" rx="6" fill-opacity="0.25" stroke-width="1.25" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect></g><text x="24" y="124" font-weight="600" style="fill: var(--text-primary);">After reordering</text><text x="24" y="142" font-size="11.5" style="fill: var(--text-secondary);">as early as possible</text><text x="24" y="186" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">clouds overlaps gbuffer</text><text x="300" y="125" text-anchor="middle" style="fill: var(--text-primary);">GBuf</text><text x="410" y="125" text-anchor="middle" style="fill: var(--text-primary);">Light</text><text x="520" y="125" text-anchor="middle" style="fill: var(--text-primary);">TAA</text><text x="630" y="125" text-anchor="middle" style="fill: var(--text-primary);">Post</text><text x="300" y="169" text-anchor="middle" style="fill: var(--text-primary);">Clouds</text><text x="410" y="169" text-anchor="middle" style="fill: var(--text-primary);">CloudUp</text><text x="244" y="202" text-anchor="end" font-size="11.5" style="fill: var(--text-primary);">gbuffer</text><text x="244" y="220" text-anchor="end" font-size="11.5" style="fill: var(--text-primary);">clouds_raw</text><text x="354" y="238" text-anchor="end" font-size="11.5" style="fill: var(--text-primary);">clouds</text></g><g><g><g fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"><path d="M340 292H370" marker-end="url(#ba-arrow)"></path><path d="M450 292H480" marker-end="url(#ba-arrow)"></path><path d="M560 292H590" marker-end="url(#ba-arrow)"></path><path d="M450 336H480" marker-end="url(#ba-arrow)"></path><path d="M560 336H630V307" marker-end="url(#ba-arrow)"></path></g><rect x="260" y="277" width="80" height="30" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="370" y="277" width="80" height="30" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="480" y="277" width="80" height="30" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="590" y="277" width="80" height="30" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="370" y="321" width