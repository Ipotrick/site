<svg viewBox="0 0 760 368" role="img" aria-label="Naive: two reads with different optimal layouts are separate timeline entries, so there is a write to read barrier and a read to read barrier. Merged: both reads form one entry in the general layout, with only one barrier." font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" width="760" height="368"><style>svg{--text-primary:rgb(11, 11, 11);--text-secondary:rgb(82, 81, 78);--chart-axis:rgb(195, 194, 183);--chart-status-critical:rgb(208, 59, 59);--chart-grid:rgba(11,11,11,0.1);--chart-categorical-1:rgb(42, 120, 214);--chart-categorical-2:rgb(235, 104, 52);--chart-status-warning:rgb(250, 178, 25);--chart-status-good:rgb(12, 163, 12)}@media (prefers-color-scheme:dark){svg{--text-primary:rgb(240, 239, 236);--text-secondary:rgb(195, 194, 183);--chart-axis:rgb(56, 56, 53);--chart-status-critical:rgb(208, 59, 59);--chart-grid:rgba(255,255,255,0.1);--chart-categorical-1:rgb(57, 135, 229);--chart-categorical-2:rgb(217, 89, 38);--chart-status-warning:rgb(250, 178, 25);--chart-status-good:rgb(12, 163, 12)}}</style><text x="24" y="30" font-size="15" font-weight="600" style="fill: var(--text-primary);">Merging reads with different optimal layouts</text><text x="24" y="50" font-size="11.5" style="fill: var(--text-secondary);">GBuf writes the depth image, AO samples it in a shader, Decals use it as a read only depth attachment.</text><g><g><rect x="214" y="67" width="92" height="30" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><text x="260" y="87" text-anchor="middle" style="fill: var(--text-primary);">GBuf</text></g><g><rect x="394" y="67" width="92" height="30" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><text x="440" y="87" text-anchor="middle" style="fill: var(--text-primary);">AO</text></g><g><rect x="574" y="67" width="92" height="30" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><text x="620" y="87" text-anchor="middle" style="fill: var(--text-primary);">Decals</text></g></g><g><text x="24" y="136" font-weight="600" style="fill: var(--text-primary);">Naive</text><text x="24" y="154" font-size="11.5" style="fill: var(--chart-status-critical);">read after read barrier</text><line x1="190" x2="700" y1="132" y2="132" stroke-width="2" style="stroke: var(--chart-grid);"></line><g><circle cx="260" cy="132" r="15" fill-opacity="0.18" stroke-width="1.5" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></circle><text x="260" y="136" text-anchor="middle" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">W</text><text x="260" y="164" text-anchor="middle" font-size="11" style="fill: var(--text-secondary);">depth attachment</text></g><g><circle cx="440" cy="132" r="15" fill-opacity="0.18" stroke-width="1.5" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></circle><text x="440" y="136" text-anchor="middle" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">R</text><text x="440" y="164" text-anchor="middle" font-size="11" style="fill: var(--text-secondary);">shader read</text></g><g><circle cx="620" cy="132" r="15" fill-opacity="0.18" stroke-width="1.5" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></circle><text x="620" y="136" text-anchor="middle" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">R</text><text x="620" y="164" text-anchor="middle" font-size="11" style="fill: var(--text-secondary);">depth read only</text></g><g><rect x="346" y="106" width="8" height="52" rx="2" fill-opacity="0.5" style="fill: var(--chart-status-warning); stroke: var(--chart-status-warning);"></rect><text x="350" y="100" text-anchor="middle" font-size="11" style="fill: var(--text-primary);">barrier</text></g><g><rect x="526" y="106" width="8" height="52" rx="2" fill-opacity="0.5" style="fill: var(--chart-status-critical); stroke: var(--chart-status-critical);"></rect><text x="530" y="100" text-anchor="middle" font-size="11" style="fill: var(--text-primary);">barrier</text></g></g><line x1="24" x2="736" y1="214" y2="214" style="stroke: var(--chart-grid);"></line><g><text x="24" y="256" font-weight="600" style="fill: var(--text-primary);">Merged</text><text x="24" y="274" font-size="11.5" style="fill: var(--chart-status-good);">one entry, one barrier</text><g><rect x="214" y="247" width="92" height="30" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><text x="260" y="267" text-anchor="middle" style="fill: var(--text-primary);">GBuf</text></g><g><rect x="394" y="247" width="92" height="30" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><text x="440" y="267" text-anchor="middle" style="fill: var(--text-primary);">AO</text></g><g><rect x="574" y="247" width="92" height="30" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><text x="620" y="267" text-anchor="middle" style="fill: var(--text-primary);">Decals</text></g><line x1="190" x2="700" y1="316" y2="316" stroke-width="2" style="stroke: var(--chart-grid);"></line><g><circle cx="260" cy="316" r="15" fill-opacity="0.18" stroke-width="1.5" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></circle><text x="260" y="320" text-anchor="middle" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">W</text><text x="260" y="348" text-anchor="middle" font-size="11" style="fill: var(--text-secondary);">depth attachment</text></g><rect x="422" y="301" width="216" height="30" rx="15" fill-opacity="0.18" stroke-width="1.5" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><text x="530" y="320" text-anchor="middle" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">R</text><text x="530" y="348" text-anchor="middle" font-size="11" style="fill: var(--text-secondary);">different optimal layouts, so general layout</text><g><rect x="346" y="290" width="8" height="52" rx="2" fill-opacity="0.5" style="fill: var(--chart-status-warning); stroke: var(--chart-status-warning);"></rect><text x="350" y="284" text-anchor="middle" font-size="11" style="fill: var(--text-primary);">barrier</text></g></g></svg>