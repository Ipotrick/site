<svg viewBox="0 0 760 560" role="img" aria-label="Before wiggling, shadows, sky LUT and exposure sit in batch 0, which mixes graphics and compute, and batches 1 to 4 only have near passes. After wiggling, each of them moves into a later batch of the same kind of work and hides that batch near wait." font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" width="760" height="560"><style>svg{--chart-axis:rgb(195, 194, 183);--text-primary:rgb(11, 11, 11);--text-secondary:rgb(82, 81, 78);--chart-categorical-1:rgb(42, 120, 214);--chart-categorical-2:rgb(235, 104, 52);--chart-status-warning:rgb(250, 178, 25);--chart-status-critical:rgb(208, 59, 59);--chart-status-good:rgb(12, 163, 12)}@media (prefers-color-scheme:dark){svg{--chart-axis:rgb(56, 56, 53);--text-primary:rgb(240, 239, 236);--text-secondary:rgb(195, 194, 183);--chart-categorical-1:rgb(57, 135, 229);--chart-categorical-2:rgb(217, 89, 38);--chart-status-warning:rgb(250, 178, 25);--chart-status-critical:rgb(208, 59, 59);--chart-status-good:rgb(12, 163, 12)}}</style><defs><marker id="wg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill: var(--chart-axis);"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" style="fill: var(--text-primary);">Wiggling free passes into later batches</text><text x="24" y="50" font-size="11.5" style="fill: var(--text-secondary);">Critical path: depth, Hi-Z, culling, main draw, lighting. Shadows, sky LUT and exposure need nothing here</text><text x="24" y="66" font-size="11.5" style="fill: var(--text-secondary);">and are only read by lighting, so they can sit anywhere in batches 0 to 3. Particles needs Hi-Z and feeds the main draw, so it is locked.</text><g><rect x="24" y="78" width="18" height="12" rx="3" fill-opacity="0.3" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="48" y="88" font-size="11.5" style="fill: var(--text-primary);">graphics</text><rect x="120" y="78" width="18" height="12" rx="3" fill-opacity="0.3" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><text x="144" y="88" font-size="11.5" style="fill: var(--text-primary);">compute</text><rect x="216" y="78" width="18" height="12" rx="3" fill-opacity="0.12" stroke-dasharray="4 2" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><text x="240" y="88" font-size="11.5" style="fill: var(--text-primary);">far pass</text><line x1="312" x2="336" y1="84" y2="84" stroke-width="2.5" style="stroke: var(--chart-status-warning);"></line><text x="342" y="88" font-size="11.5" style="fill: var(--text-primary);">near wait</text><rect x="420" y="77" width="26" height="14" rx="5" fill-opacity="0.06" stroke-dasharray="2 3" style="fill: var(--chart-categorical-2); stroke: var(--text-secondary);"></rect><text x="452" y="88" font-size="11.5" style="fill: var(--text-primary);">where a free pass may go</text></g><g><text x="24" y="122" font-weight="600" style="fill: var(--text-primary);">As early as possible</text><text x="214" y="122" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">Batch 0</text><text x="324" y="122" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">Batch 1</text><text x="434" y="122" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">Batch 2</text><text x="544" y="122" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">Batch 3</text><text x="654" y="122" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">Batch 4</text><rect x="161" y="200" width="436" height="32" rx="10" fill-opacity="0.06" stroke-width="1" stroke-dasharray="2 3" style="fill: var(--chart-categorical-2); stroke: var(--text-secondary);"></rect><rect x="161" y="232" width="436" height="32" rx="10" fill-opacity="0.06" stroke-width="1" stroke-dasharray="2 3" style="fill: var(--chart-categorical-2); stroke: var(--text-secondary);"></rect><rect x="161" y="264" width="436" height="32" rx="10" fill-opacity="0.06" stroke-width="1" stroke-dasharray="2 3" style="fill: var(--chart-categorical-2); stroke: var(--text-secondary);"></rect><line x1="275" x2="373" y1="134" y2="134" stroke-width="2.5" style="stroke: var(--chart-status-warning);"></line><line x1="385" x2="483" y1="134" y2="134" stroke-width="2.5" style="stroke: var(--chart-status-warning);"></line><line x1="495" x2="593" y1="134" y2="134" stroke-width="2.5" style="stroke: var(--chart-status-warning);"></line><line x1="605" x2="703" y1="134" y2="134" stroke-width="2.5" style="stroke: var(--chart-status-warning);"></line><g fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"><line x1="263" x2="275" y1="152" y2="152" marker-end="url(#wg-a)"></line><line x1="373" x2="385" y1="152" y2="152" marker-end="url(#wg-a)"></line><line x1="483" x2="495" y1="152" y2="152" marker-end="url(#wg-a)"></line><line x1="593" x2="605" y1="152" y2="152" marker-end="url(#wg-a)"></line></g><g><rect x="165" y="140" width="98" height="24" rx="7" fill-opacity="0.3" stroke-width="1.5" stroke-dasharray="none" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="214" y="156" text-anchor="middle" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">Depth</text></g><g><rect x="275" y="140" width="98" height="24" rx="7" fill-opacity="0.3" stroke-width="1.5" stroke-dasharray="none" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><text x="324" y="156" text-anchor="middle" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">Hi-Z</text></g><g><rect x="385" y="140" width="98" height="24" rx="7" fill-opacity="0.3" stroke-width="1.5" stroke-dasharray="none" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><text x="434" y="156" text-anchor="middle" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">Culling</text></g><g><rect x="495" y="140" width="98" height="24" rx="7" fill-opacity="0.3" stroke-width="1.5" stroke-dasharray="none" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="544" y="156" text-anchor="middle" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">Main draw</text></g><g><rect x="605" y="140" width="98" height="24" rx="7" fill-opacity="0.3" stroke-width="1.5" stroke-dasharray="none" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><text x="654" y="156" text-anchor="middle" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">Lighting</text></g><g><rect x="385" y="172" width="98" height="24" rx="7" fill-opacity="0.3" stroke-width="1.5" stroke-dasharray="none" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><text x="434" y="188" text-anchor="middle" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">Particles</text></g><g><rect x="165" y="204" width="98" height="24" rx="7" fill-opacity="0.3" stroke-width="1.5" stroke-dasharray="none" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="214" y="220" text-anchor="middle" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">Shadows</text></g><g><rect x="165" y="236" width="98" height="24" rx="7" fill-opacity="0.3" stroke-width="1.5" stroke-dasharray="none" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><text x="214" y="252" text-anchor="middle" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">Sky LUT</text></g><g><rect x="165" y="268" width="98" height="24" rx="7" fill-opacity="0.3" stroke-width="1.5" stroke-dasharray="none" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><text x="214" y="284" text-anchor="middle" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">Exposure</text></g><text x="24" y="156" font-size="11.5" style="fill: var(--chart-status-critical);">every wait is exposed,</text><text x="24" y="172" font-size="11.5" style="fill: var(--chart-status-critical);">batch 0 mixes graphics</text><text x="24" y="188" font-size="11.5" style="fill: var(--chart-status-critical);">and compute</text></g><g><text x="24" y="362" font-weight="600" style="fill: var(--text-primary);">After wiggling</text><text x="214" y="362" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">Batch 0</text><text x="324" y="362" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">Batch 1</text><text x="434" y="362" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">Batch 2</text><text x="544" y="362" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">Batch 3</text><text x="654" y="362" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">Batch 4</text><g><rect x="275" y="378" width="98" height="24" rx="7" fill-opacity="0.12" stroke-width="1.5" stroke-dasharray="4 2" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><text x="324" y="394" text-anchor="middle" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">Sky LUT</text></g><g><rect x="385" y="378" width="98" height="24" rx="7" fill-opacity="0.12" stroke-width="1.5" stroke-dasharray="4 2" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><text x="434" y="394" text-anchor="middle" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">Exposure</text></g><g><rect x="495" y="378" width="98" height="24" rx="7" fill-opacity="0.12" stroke-width="1.5" stroke-dasharray="4 2" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="544" y="394" text-anchor="middle" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">Shadows</text></g><line x1="275" x2="373" y1="411" y2="411" stroke-width="2.5" style="stroke: var(--chart-status-warning);"></line><line x1="385" x2="483" y1="411" y2="411" stroke-width="2.5" style="stroke: var(--chart-status-warning);"></line><line x1="495" x2="593" y1="411" y2="411" stroke-width="2.5" style="stroke: var(--chart-status-warning);"></line><line x1="605" x2="703" y1="411" y2="411" stroke-width="2.5" style="stroke: var(--chart-status-warning);"></line><g fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"><line x1="263" x2="275" y1="432" y2="432" marker-end="url(#wg-a)"></line><line x1="373" x2="385" y1="432" y2="432" marker-end="url(#wg-a)"></line><line x1="483" x2="495" y1="432" y2="432" marker-end="url(#wg-a)"></line><line x1="593" x2="605" y1="432" y2="432" marker-end="url(#wg-a)"></line></g><g><rect x="165" y="420" width="98" height="24" rx="7" fill-opacity="0.3" stroke-width="1.5" stroke-dasharray="none" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="214" y="436" text-anchor="middle" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">Depth</text></g><g><rect x="275" y="420" width="98" height="24" rx="7" fill-opacity="0.3" stroke-width="1.5" stroke-dasharray="none" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><text x="324" y="436" text-anchor="middle" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">Hi-Z</text></g><g><rect x="385" y="420" width="98" height="24" rx="7" fill-opacity="0.3" stroke-width="1.5" stroke-dasharray="none" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><text x="434" y="436" text-anchor="middle" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">Culling</text></g><g><rect x="495" y="420" width="98" height="24" rx="7" fill-opacity="0.3" stroke-width="1.5" stroke-dasharray="none" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="544" y="436" text-anchor="middle" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">Main draw</text></g><g><rect x="605" y="420" width="98" height="24" rx="7" fill-opacity="0.3" stroke-width="1.5" stroke-dasharray="none" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><text x="654" y="436" text-anchor="middle" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">Lighting</text></g><g><rect x="385" y="452" width="98" height="24" rx="7" fill-opacity="0.3" stroke-width="1.5" stroke-dasharray="none" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><text x="434" y="468" text-anchor="middle" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">Particles</text></g><text x="24" y="402" font-size="11.5" style="fill: var(--chart-status-good);">each free pass lands in</text><text x="24" y="418" font-size="11.5" style="fill: var(--chart-status-good);">a batch of its own kind</text><text x="24" y="434" font-size="11.5" style="fill: var(--chart-status-good);">and hides its near wait</text><text x="654" y="394" text-anchor="middle" font-size="11" style="fill: var(--text-secondary);">nothing left</text><text x="654" y="406" text-anchor="middle" font-size="11" style="fill: var(--text-secondary);">to plant</text><text x="24" y="520" font-size="11.5" style="fill: var(--text-secondary);">Same five batches, same critical path. Batch 0 is now pure graphics, batches 1 and 2 pure compute.</text></g></svg>