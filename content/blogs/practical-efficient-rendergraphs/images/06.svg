<svg viewBox="0 0 760 480" role="img" aria-label="The graph sees the whole frame first, so it can reorder passes and record 4 barriers instead of 6" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" width="760" height="480"><style>@media (prefers-color-scheme:dark){[fill="rgb(11, 11, 11)"]{fill:#e8eef2}[fill="rgb(82, 81, 78)"]{fill:#aeb6c2}[stroke="rgb(82, 81, 78)"]{stroke:#aeb6c2}[fill="rgb(195, 194, 183)"]{fill:#6b7280}[stroke="rgb(195, 194, 183)"]{stroke:#6b7280}[stroke="rgba(11,11,11,0.1)"]{stroke:rgba(255,255,255,.16)}[fill="rgb(98, 80, 214)"]{fill:#9a8ff2}[stroke="rgb(98, 80, 214)"]{stroke:#9a8ff2}[fill="rgb(0, 131, 0)"]{fill:#3fc23f}[stroke="rgb(0, 131, 0)"]{stroke:#3fc23f}[fill="rgb(208, 59, 59)"]{fill:#ef7070}[stroke="rgb(208, 59, 59)"]{stroke:#ef7070}}</style><defs><marker id="tl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="rgb(195, 194, 183)"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="rgb(11, 11, 11)">Two level recording of the example frame</text><g fill="none" stroke="rgb(195, 194, 183)" stroke-width="1.25"><path d="M240 205H270" marker-end="url(#tl-arrow)"></path><path d="M488 205H518" marker-end="url(#tl-arrow)"></path></g><g><rect x="24" y="60" width="216" height="290" rx="8" fill="none" fill-opacity="1" stroke="rgb(195, 194, 183)" stroke-width="1.25"></rect><text x="40" y="86" font-weight="600" fill="rgb(11, 11, 11)">1. High level recording</text><g><rect x="40" y="100" width="184" height="20" rx="6" fill="none" stroke="rgb(195, 194, 183)" stroke-width="1"></rect><text x="50" y="114" font-size="11.5" fill="rgb(11, 11, 11)">Cull</text><text x="214" y="114" text-anchor="end" font-size="11" fill="rgb(82, 81, 78)">light_list</text></g><g><rect x="40" y="126" width="184" height="20" rx="6" fill="none" stroke="rgb(195, 194, 183)" stroke-width="1"></rect><text x="50" y="140" font-size="11.5" fill="rgb(11, 11, 11)">Shadow</text><text x="214" y="140" text-anchor="end" font-size="11" fill="rgb(82, 81, 78)">shadow_maps</text></g><g><rect x="40" y="152" width="184" height="20" rx="6" fill="none" stroke="rgb(195, 194, 183)" stroke-width="1"></rect><text x="50" y="166" font-size="11.5" fill="rgb(11, 11, 11)">Vol</text><text x="214" y="166" text-anchor="end" font-size="11" fill="rgb(82, 81, 78)">froxels</text></g><g><rect x="40" y="178" width="184" height="20" rx="6" fill="none" stroke="rgb(195, 194, 183)" stroke-width="1"></rect><text x="50" y="192" font-size="11.5" fill="rgb(11, 11, 11)">GBuf</text><text x="214" y="192" text-anchor="end" font-size="11" fill="rgb(82, 81, 78)">gbuffer</text></g><g><rect x="40" y="204" width="184" height="20" rx="6" fill="none" stroke="rgb(195, 194, 183)" stroke-width="1"></rect><text x="50" y="218" font-size="11.5" fill="rgb(11, 11, 11)">AO</text><text x="214" y="218" text-anchor="end" font-size="11" fill="rgb(82, 81, 78)">ao</text></g><g><rect x="40" y="230" width="184" height="20" rx="6" fill="none" stroke="rgb(195, 194, 183)" stroke-width="1"></rect><text x="50" y="244" font-size="11.5" fill="rgb(11, 11, 11)">Denoise</text><text x="214" y="244" text-anchor="end" font-size="11" fill="rgb(82, 81, 78)">ao_denoised</text></g><g><rect x="40" y="256" width="184" height="20" rx="6" fill="none" stroke="rgb(195, 194, 183)" stroke-width="1"></rect><text x="50" y="270" font-size="11.5" fill="rgb(11, 11, 11)">Light</text><text x="214" y="270" text-anchor="end" font-size="11" fill="rgb(82, 81, 78)">hdr</text></g><g><rect x="40" y="282" width="184" height="20" rx="6" fill="none" stroke="rgb(195, 194, 183)" stroke-width="1"></rect><text x="50" y="296" font-size="11.5" fill="rgb(11, 11, 11)">Post</text><text x="214" y="296" text-anchor="end" font-size="11" fill="rgb(82, 81, 78)">final</text></g><text x="40" y="330" font-size="11.5" fill="rgb(82, 81, 78)">Callbacks are stored, not run</text></g><g><rect x="272" y="60" width="216" height="290" rx="8" fill="none" fill-opacity="1" stroke="rgb(195, 194, 183)" stroke-width="1.25"></rect><text x="288" y="86" font-weight="600" fill="rgb(11, 11, 11)">2. Analysis</text><text x="288" y="114" font-size="11.5" fill="rgb(11, 11, 11)">Cull → Shadow → Vol</text><text x="288" y="134" font-size="11.5" fill="rgb(11, 11, 11)">GBuf → AO → Denoise</text><text x="288" y="156" font-size="11.5" fill="rgb(82, 81, 78)">Independent until Light</text><line x1="288" x2="472" y1="172" y2="172" stroke="rgba(11,11,11,0.1)"></line><text x="288" y="196" font-size="11.5" fill="rgb(11, 11, 11)">Batch 0: Cull, GBuf</text><text x="288" y="218" font-size="11.5" fill="rgb(11, 11, 11)">Batch 1: Shadow, AO</text><text x="288" y="240" font-size="11.5" fill="rgb(11, 11, 11)">Batch 2: Vol, Denoise</text><text x="288" y="262" font-size="11.5" fill="rgb(11, 11, 11)">Batch 3: Light</text><text x="288" y="284" font-size="11.5" fill="rgb(11, 11, 11)">Batch 4: Post</text><text x="288" y="330" font-size="11.5" fill="rgb(82, 81, 78)">One barrier between batches</text></g><g><rect x="520" y="60" width="216" height="290" rx="8" fill="rgb(42, 120, 214)" fill-opacity="0.08" stroke="rgb(42, 120, 214)" stroke-width="2"></rect><text x="536" y="86" font-weight="600" fill="rgb(11, 11, 11)">3. Low level recording</text><g><rect x="536" y="100" width="184" height="20" rx="6" fill="none" stroke="rgb(195, 194, 183)" stroke-width="1"></rect><text x="628" y="114" text-anchor="middle" font-size="11.5" fill="rgb(11, 11, 11)">Cull, GBuf</text></g><rect x="536" y="128" width="184" height="12" rx="3" fill="rgb(195, 194, 183)"></rect><g><rect x="536" y="148" width="184" height="20" rx="6" fill="none" stroke="rgb(195, 194, 183)" stroke-width="1"></rect><text x="628" y="162" text-anchor="middle" font-size="11.5" fill="rgb(11, 11, 11)">Shadow, AO</text></g><rect x="536" y="176" width="184" height="12" rx="3" fill="rgb(195, 194, 183)"></rect><g><rect x="536" y="196" width="184" height="20" rx="6" fill="none" stroke="rgb(195, 194, 183)" stroke-width="1"></rect><text x="628" y="210" text-anchor="middle" font-size="11.5" fill="rgb(11, 11, 11)">Vol, Denoise</text></g><rect x="536" y="224" width="184" height="12" rx="3" fill="rgb(195, 194, 183)"></rect><g><rect x="536" y="244" width="184" height="20" rx="6" fill="none" stroke="rgb(195, 194, 183)" stroke-width="1"></rect><text x="628" y="258" text-anchor="middle" font-size="11.5" fill="rgb(11, 11, 11)">Light</text></g><rect x="536" y="272" width="184" height="12" rx="3" fill="rgb(195, 194, 183)"></rect><g><rect x="536" y="292" width="184" height="20" rx="6" fill="none" stroke="rgb(195, 194, 183)" stroke-width="1"></rect><text x="628" y="306" text-anchor="middle" font-size="11.5" fill="rgb(11, 11, 11)">Post</text></g><text x="536" y="330" font-size="11.5" font-weight="600" fill="rgb(11, 11, 11)">4 barriers</text></g><line x1="24" x2="736" y1="376" y2="376" stroke="rgba(11,11,11,0.1)"></line><g><text x="24" y="404" font-weight="600" fill="rgb(11, 11, 11)">Just in time, in recording order</text><text x="736" y="404" text-anchor="end" font-size="11.5" font-weight="600" fill="rgb(11, 11, 11)">6 barriers</text><g><rect x="24" y="428" width="64" height="32" rx="8" fill="none" stroke="rgb(195, 194, 183)" stroke-width="1.25"></rect><text x="56" y="448" text-anchor="middle" font-size="11.5" fill="rgb(11, 11, 11)">Cull</text></g><rect x="94" y="428" width="10" height="32" rx="3" fill="rgb(195, 194, 183)"></rect><g><rect x="110" y="428" width="64" height="32" rx="8" fill="none" stroke="rgb(195, 194, 183)" stroke-width="1.25"></rect><text x="142" y="448" text-anchor="middle" font-size="11.5" fill="rgb(11, 11, 11)">Shadow</text></g><rect x="180" y="428" width="10" height="32" rx="3" fill="rgb(195, 194, 183)"></rect><g><rect x="196" y="428" width="64" height="32" rx="8" fill="none" stroke="rgb(195, 194, 183)" stroke-width="1.25"></rect><text x="228" y="448" text-anchor="middle" font-size="11.5" fill="rgb(11, 11, 11)">Vol</text></g><g><rect x="266" y="428" width="64" height="32" rx="8" fill="none" stroke="rgb(195, 194, 183)" stroke-width="1.25"></rect><text x="298" y="448" text-anchor="middle" font-size="11.5" fill="rgb(11, 11, 11)">GBuf</text></g><rect x="336" y="428" width="10" height="32" rx="3" fill="rgb(195, 194, 183)"></rect><g><rect x="352" y="428" width="64" height="32" rx="8" fill="none" stroke="rgb(195, 194, 183)" stroke-width="1.25"></rect><text x="384" y="448" text-anchor="middle" font-size="11.5" fill="rgb(11, 11, 11)">AO</text></g><rect x="422" y="428" width="10" height="32" rx="3" fill="rgb(195, 194, 183)"></rect><g><rect x="438" y="428" width="64" height="32" rx="8" fill="none" stroke="rgb(195, 194, 183)" stroke-width="1.25"></rect><text x="470" y="448" text-anchor="middle" font-size="11.5" fill="rgb(11, 11, 11)">Denoise</text></g><rect x="508" y="428" width="10" height="32" rx="3" fill="rgb(195, 194, 183)"></rect><g><rect x="524" y="428" width="64" height="32" rx="8" fill="none" stroke="rgb(195, 194, 183)" stroke-width="1.25"></rect><text x="556" y="448" text-anchor="middle" font-size="11.5" fill="rgb(11, 11, 11)">Light</text></g><rect x="594" y="428" width="10" height="32" rx="3" fill="rgb(195, 194, 183)"></rect><g><rect x="610" y="428" width="64" height="32" rx="8" fill="none" stroke="rgb(195, 194, 183)" stroke-width="1.25"></rect><text x="642" y="448" text-anchor="middle" font-size="11.5" fill="rgb(11, 11, 11)">Post</text></g></g></svg>