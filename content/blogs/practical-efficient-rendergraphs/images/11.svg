<svg viewBox="0 0 760 412" role="img" aria-label="The barrier at a change of access also transitions the image layout" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" width="760" height="412"><style>svg{--chart-categorical-1:rgb(42, 120, 214);--chart-axis:rgb(195, 194, 183);--text-primary:rgb(11, 11, 11);--text-secondary:rgb(82, 81, 78);--chart-grid:rgba(11,11,11,0.1)}@media (prefers-color-scheme:dark){svg{--chart-categorical-1:rgb(57, 135, 229);--chart-axis:rgb(56, 56, 53);--text-primary:rgb(240, 239, 236);--text-secondary:rgb(195, 194, 183);--chart-grid:rgba(255,255,255,0.1)}}</style><defs><marker id="lay-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill: var(--chart-categorical-1);"></path></marker><marker id="lay-down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill: var(--chart-axis);"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" style="fill: var(--text-primary);">Layout transitions on the hdr timeline</text><text x="24" y="50" font-size="11.5" style="fill: var(--text-secondary);">The hdr image in recording order. Layouts with their Vulkan names.</text><text x="24" y="104" style="fill: var(--text-secondary);">Passes</text><line x1="260" x2="260" y1="116" y2="149" stroke-dasharray="3 3" style="stroke: var(--chart-grid);"></line><line x1="380" x2="380" y1="116" y2="149" stroke-dasharray="3 3" style="stroke: var(--chart-grid);"></line><line x1="500" x2="500" y1="116" y2="149" stroke-dasharray="3 3" style="stroke: var(--chart-grid);"></line><line x1="620" x2="620" y1="116" y2="149" stroke-dasharray="3 3" style="stroke: var(--chart-grid);"></line><line x1="160" x2="736" y1="164" y2="164" stroke-width="2" style="stroke: var(--chart-grid);"></line><text x="24" y="168" style="fill: var(--text-primary);">hdr</text><g><rect x="220" y="84" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="340" y="84" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="460" y="84" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="580" y="84" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><text x="260" y="105" text-anchor="middle" style="fill: var(--text-primary);">Light</text><text x="380" y="105" text-anchor="middle" style="fill: var(--text-primary);">SSR</text><text x="500" y="105" text-anchor="middle" style="fill: var(--text-primary);">Exposure</text><text x="620" y="105" text-anchor="middle" style="fill: var(--text-primary);">Copy</text></g><g fill="none" stroke-width="1.5" style="stroke: var(--chart-categorical-1);"><path d="M276 164H363" marker-end="url(#lay-a)"></path><path d="M396 164H483" marker-end="url(#lay-a)"></path><path d="M516 164H603" marker-end="url(#lay-a)"></path></g><g><circle cx="260" cy="164" r="15" fill-opacity="0.15" stroke-width="1.5" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></circle><circle cx="380" cy="164" r="15" fill-opacity="0.15" stroke-width="1.5" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></circle><circle cx="500" cy="164" r="15" fill-opacity="0.15" stroke-width="1.5" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></circle><circle cx="620" cy="164" r="15" fill-opacity="0.15" stroke-width="1.5" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></circle><text x="260" y="168" text-anchor="middle" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">W</text><text x="380" y="168" text-anchor="middle" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">R</text><text x="500" y="168" text-anchor="middle" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">R</text><text x="620" y="168" text-anchor="middle" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">R</text><text x="260" y="198" text-anchor="middle" font-size="11.5" style="fill: var(--text-primary);">color write</text><text x="260" y="214" text-anchor="middle" font-size="11" style="fill: var(--text-secondary);">COLOR_ATTACHMENT</text><text x="380" y="198" text-anchor="middle" font-size="11.5" style="fill: var(--text-primary);">sampled read</text><text x="380" y="214" text-anchor="middle" font-size="11" style="fill: var(--text-secondary);">READ_ONLY</text><text x="500" y="198" text-anchor="middle" font-size="11.5" style="fill: var(--text-primary);">sampled read</text><text x="500" y="214" text-anchor="middle" font-size="11" style="fill: var(--text-secondary);">READ_ONLY</text><text x="620" y="198" text-anchor="middle" font-size="11.5" style="fill: var(--text-primary);">copy source</text><text x="620" y="214" text-anchor="middle" font-size="11" style="fill: var(--text-secondary);">TRANSFER_SRC</text></g><g fill="none" stroke-width="1.25" stroke-dasharray="4 4" style="stroke: var(--chart-axis);"><path d="M292 164C320 164 320 164 320 192V254"></path><path d="M532 164C560 164 560 164 560 192V254"></path></g><text x="24" y="266" style="fill: var(--text-secondary);">Barriers</text><g><path d="M320 254l8 8l-8 8l-8 -8z" style="fill: var(--chart-axis);"></path><path d="M560 254l8 8l-8 8l-8 -8z" style="fill: var(--chart-axis);"></path><text x="330" y="292" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">W → R, transition</text><text x="330" y="308" font-size="11" style="fill: var(--text-secondary);">COLOR → READ_ONLY</text><text x="440" y="266" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">same layout</text><text x="570" y="292" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">R → R, transition</text><text x="570" y="308" font-size="11" style="fill: var(--text-secondary);">READ_ONLY → TRANSFER_SRC</text></g><g fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"><path d="M320 270V322" marker-end="url(#lay-down)"></path><path d="M560 270V322" marker-end="url(#lay-down)"></path></g><text x="24" y="346" style="fill: var(--text-secondary);">Final order</text><g><rect x="220" y="326" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="340" y="326" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="460" y="326" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="580" y="326" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="315" y="326" width="10" height="32" rx="3" style="fill: var(--chart-axis);"></rect><rect x="555" y="326" width="10" height="32" rx="3" style="fill: var(--chart-axis);"></rect><text x="260" y="347" text-anchor="middle" style="fill: var(--text-primary);">Light</text><text x="380" y="347" text-anchor="middle" style="fill: var(--text-primary);">SSR</text><text x="500" y="347" text-anchor="middle" style="fill: var(--text-primary);">Exposure</text><text x="620" y="347" text-anchor="middle" style="fill: var(--text-primary);">Copy</text></g><text x="24" y="392" font-size="11.5" style="fill: var(--text-secondary);">Exposure reads in the same layout as SSR, so no barrier. Copy only reads too, but needs a new layout.</text></svg>