<svg viewBox="0 0 760 780" role="img" aria-label="First the batches with far and near passes, then execution with one barrier per batch, then execution with split barriers, where each barrier begins right after its producer and waits right before its consumer, so far passes start early and the work finishes earlier" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" width="760" height="780"><style>svg{--chart-status-warning:rgb(250, 178, 25);--chart-status-good:rgb(12, 163, 12);--text-primary:rgb(11, 11, 11);--text-secondary:rgb(82, 81, 78);--chart-categorical-1:rgb(42, 120, 214);--chart-categorical-2:rgb(235, 104, 52);--chart-categorical-3:rgb(27, 175, 122);--chart-axis:rgb(195, 194, 183)}@media (prefers-color-scheme:dark){svg{--chart-status-warning:rgb(250, 178, 25);--chart-status-good:rgb(12, 163, 12);--text-primary:rgb(240, 239, 236);--text-secondary:rgb(195, 194, 183);--chart-categorical-1:rgb(57, 135, 229);--chart-categorical-2:rgb(217, 89, 38);--chart-categorical-3:rgb(25, 158, 112);--chart-axis:rgb(56, 56, 53)}}</style><defs><marker id="fn-near" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill: var(--chart-status-warning);"></path></marker><marker id="fn-far" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill: var(--chart-status-good);"></path></marker><marker id="fn-sv" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill: var(--text-secondary);"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" style="fill: var(--text-primary);">Split barriers with far and near passes</text><text x="24" y="50" font-size="11.5" style="fill: var(--text-secondary);">Illustrative. Colors are batches 0 to 3, dashed passes are far passes.</text><g><text x="24" y="88" font-weight="600" style="fill: var(--text-primary);">1. The batches</text><text x="200" y="124" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">Batch 0</text><text x="340" y="124" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">Batch 1</text><text x="480" y="124" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">Batch 2</text><text x="620" y="124" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">Batch 3</text><text x="24" y="172" font-size="11.5" style="fill: var(--text-primary);">far: deps 2+ back</text><text x="24" y="222" font-size="11.5" style="fill: var(--text-primary);">near: deps 1 back</text><g fill="none" stroke-width="1.75"><path d="M240 174L300 212" marker-end="url(#fn-near)" style="stroke: var(--chart-status-warning);"></path><path d="M380 218L440 218" marker-end="url(#fn-near)" style="stroke: var(--chart-status-warning);"></path><path d="M520 218L580 218" marker-end="url(#fn-near)" style="stroke: var(--chart-status-warning);"></path><path d="M240 214L440 174" marker-end="url(#fn-far)" style="stroke: var(--chart-status-good);"></path><path d="M340 153Q480 110 620 153" marker-end="url(#fn-far)" style="stroke: var(--chart-status-good);"></path></g><g><rect x="160" y="153" width="80" height="30" rx="8" fill-opacity="0.3" stroke-width="1.5" stroke-dasharray="none" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="200" y="173" text-anchor="middle" font-weight="600" style="fill: var(--text-primary);">P1</text></g><g><rect x="160" y="203" width="80" height="30" rx="8" fill-opacity="0.3" stroke-width="1.5" stroke-dasharray="none" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="200" y="223" text-anchor="middle" font-weight="600" style="fill: var(--text-primary);">P2</text></g><g><rect x="300" y="153" width="80" height="30" rx="8" fill-opacity="0.12" stroke-width="1.5" stroke-dasharray="4 2" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><text x="340" y="173" text-anchor="middle" font-weight="600" style="fill: var(--text-primary);">P3</text></g><g><rect x="300" y="203" width="80" height="30" rx="8" fill-opacity="0.3" stroke-width="1.5" stroke-dasharray="none" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><text x="340" y="223" text-anchor="middle" font-weight="600" style="fill: var(--text-primary);">P4</text></g><g><rect x="440" y="153" width="80" height="30" rx="8" fill-opacity="0.12" stroke-width="1.5" stroke-dasharray="4 2" style="fill: var(--chart-categorical-3); stroke: var(--chart-categorical-3);"></rect><text x="480" y="173" text-anchor="middle" font-weight="600" style="fill: var(--text-primary);">P5</text></g><g><rect x="440" y="203" width="80" height="30" rx="8" fill-opacity="0.3" stroke-width="1.5" stroke-dasharray="none" style="fill: var(--chart-categorical-3); stroke: var(--chart-categorical-3);"></rect><text x="480" y="223" text-anchor="middle" font-weight="600" style="fill: var(--text-primary);">P6</text></g><g><rect x="580" y="153" width="80" height="30" rx="8" fill-opacity="0.12" stroke-width="1.5" stroke-dasharray="4 2" style="fill: var(--text-secondary); stroke: var(--text-secondary);"></rect><text x="620" y="173" text-anchor="middle" font-weight="600" style="fill: var(--text-primary);">P7</text></g><g><rect x="580" y="203" width="80" height="30" rx="8" fill-opacity="0.3" stroke-width="1.5" stroke-dasharray="none" style="fill: var(--text-secondary); stroke: var(--text-secondary);"></rect><text x="620" y="223" text-anchor="middle" font-weight="600" style="fill: var(--text-primary);">P8</text></g><line x1="600" x2="624" y1="262" y2="262" stroke-width="2" style="stroke: var(--chart-status-warning);"></line><text x="630" y="266" font-size="11" style="fill: var(--text-primary);">near dependency</text><line x1="600" x2="624" y1="280" y2="280" stroke-width="2" style="stroke: var(--chart-status-good);"></line><text x="630" y="284" font-size="11" style="fill: var(--text-primary);">far dependency</text></g><g><text x="24" y="308" font-weight="600" style="fill: var(--text-primary);">2. Default: one barrier per batch</text><line x1="269.2" x2="269.2" y1="324" y2="476" stroke-width="2.5" style="stroke: var(--text-primary);"></line><text x="269.2" y="321" text-anchor="middle" font-size="10.5" style="fill: var(--text-secondary);">wait</text><line x1="392.4" x2="392.4" y1="324" y2="476" stroke-width="2.5" style="stroke: var(--text-primary);"></line><text x="392.4" y="321" text-anchor="middle" font-size="10.5" style="fill: var(--text-secondary);">wait</text><line x1="515.6" x2="515.6" y1="324" y2="476" stroke-width="2.5" style="stroke: var(--text-primary);"></line><text x="515.6" y="321" text-anchor="middle" font-size="10.5" style="fill: var(--text-secondary);">wait</text><g><rect x="150" y="330" width="64" height="14" rx="3" fill-opacity="0.32" stroke-width="1.25" stroke-dasharray="none" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="156" y="341" font-size="10.5" style="fill: var(--text-primary);">P1</text></g><g><rect x="201.2" y="348" width="64" height="14" rx="3" fill-opacity="0.32" stroke-width="1.25" stroke-dasharray="none" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="207.2" y="359" font-size="10.5" style="fill: var(--text-primary);">P2</text></g><g><rect x="273.2" y="366" width="64" height="14" rx="3" fill-opacity="0.32" stroke-width="1.25" stroke-dasharray="none" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><text x="279.2" y="377" font-size="10.5" style="fill: var(--text-primary);">P3</text></g><g><rect x="324.4" y="384" width="64" height="14" rx="3" fill-opacity="0.32" stroke-width="1.25" stroke-dasharray="none" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><text x="330.4" y="395" font-size="10.5" style="fill: var(--text-primary);">P4</text></g><g><rect x="396.4" y="402" width="64" height="14" rx="3" fill-opacity="0.32" stroke-width="1.25" stroke-dasharray="none" style="fill: var(--chart-categorical-3); stroke: var(--chart-categorical-3);"></rect><text x="402.4" y="413" font-size="10.5" style="fill: var(--text-primary);">P5</text></g><g><rect x="447.6" y="420" width="64" height="14" rx="3" fill-opacity="0.32" stroke-width="1.25" stroke-dasharray="none" style="fill: var(--chart-categorical-3); stroke: var(--chart-categorical-3);"></rect><text x="453.6" y="431" font-size="10.5" style="fill: var(--text-primary);">P6</text></g><g><rect x="519.6" y="438" width="64" height="14" rx="3" fill-opacity="0.32" stroke-width="1.25" stroke-dasharray="none" style="fill: var(--text-secondary); stroke: var(--text-secondary);"></rect><text x="525.6" y="449" font-size="10.5" style="fill: var(--text-primary);">P7</text></g><g><rect x="570.8" y="456" width="64" height="14" rx="3" fill-opacity="0.32" stroke-width="1.25" stroke-dasharray="none" style="fill: var(--text-secondary); stroke: var(--text-secondary);"></rect><text x="576.8" y="467" font-size="10.5" style="fill: var(--text-primary);">P8</text></g><line x1="638.8" x2="638.8" y1="322" y2="478" stroke-width="1.5" stroke-dasharray="4 3" style="stroke: var(--text-secondary);"></line><text x="644.8" y="474" font-size="11.5" font-weight="600" style="fill: var(--text-secondary);">done</text><text x="24" y="400" font-size="11.5" style="fill: var(--text-secondary);">every batch waits</text><text x="24" y="416" font-size="11.5" style="fill: var(--text-secondary);">for the whole batch</text><text x="24" y="432" font-size="11.5" style="fill: var(--text-secondary);">before it</text></g><g><text x="24" y="518" font-weight="600" style="fill: var(--text-primary);">3. Split barriers: begin early, wait late</text><g><rect x="150" y="540" width="64" height="14" rx="3" fill-opacity="0.3" stroke-width="1.25" stroke-dasharray="none" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="156" y="551" font-size="10.5" style="fill: var(--text-primary);">P1</text></g><g><rect x="201.2" y="558" width="64" height="14" rx="3" fill-opacity="0.3" stroke-width="1.25" stroke-dasharray="none" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="207.2" y="569" font-size="10.5" style="fill: var(--text-primary);">P2</text></g><g><rect x="252.4" y="576" width="64" height="14" rx="3" fill-opacity="0.12" stroke-width="1.25" stroke-dasharray="4 2" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><text x="258.4" y="587" font-size="10.5" style="fill: var(--text-primary);">P3</text></g><g><rect x="303.6" y="594" width="64" height="14" rx="3" fill-opacity="0.3" stroke-width="1.25" stroke-dasharray="none" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><text x="309.6" y="605" font-size="10.5" style="fill: var(--text-primary);">P4</text></g><g><rect x="354.8" y="612" width="64" height="14" rx="3" fill-opacity="0.12" stroke-width="1.25" stroke-dasharray="4 2" style="fill: var(--chart-categorical-3); stroke: var(--chart-categorical-3);"></rect><text x="360.8" y="623" font-size="10.5" style="fill: var(--text-primary);">P5</text></g><g><rect x="406" y="630" width="64" height="14" rx="3" fill-opacity="0.3" stroke-width="1.25" stroke-dasharray="none" style="fill: var(--chart-categorical-3); stroke: var(--chart-categorical-3);"></rect><text x="412" y="641" font-size="10.5" style="fill: var(--text-primary);">P6</text></g><g><rect x="457.2" y="648" width="64" height="14" rx="3" fill-opacity="0.12" stroke-width="1.25" stroke-dasharray="4 2" style="fill: var(--text-secondary); stroke: var(--text-secondary);"></rect><text x="463.2" y="659" font-size="10.5" style="fill: var(--text-primary);">P7</text></g><g><rect x="508.4" y="666" width="64" height="14" rx="3" fill-opacity="0.3" stroke-width="1.25" stroke-dasharray="none" style="fill: var(--text-secondary); stroke: var(--text-secondary);"></rect><text x="514.4" y="677" font-size="10.5" style="fill: var(--text-primary);">P8</text></g><path d="M214 547 C254 547 260.6 601 300.6 601" fill="none" stroke-width="1.5" marker-end="url(#fn-near)" style="stroke: var(--chart-status-warning);"></path><circle cx="214" cy="547" r="3.5" fill="none" stroke-width="1.75" style="stroke: var(--chart-status-warning);"></circle><line x1="303.6" x2="303.6" y1="594" y2="608" stroke-width="3.5" style="stroke: var(--chart-status-warning);"></line><path d="M265.2 565 C305.2 565 311.8 619 351.8 619" fill="none" stroke-width="1.5" marker-end="url(#fn-far)" style="stroke: var(--chart-status-good);"></path><circle cx="265.2" cy="565" r="3.5" fill="none" stroke-width="1.75" style="stroke: var(--chart-status-good);"></circle><line x1="354.8" x2="354.8" y1="612" y2="626" stroke-width="3.5" style="stroke: var(--chart-status-good);"></line><path d="M367.6 601 C386.8 601 383.8 637 403 637" fill="none" stroke-width="1.5" marker-end="url(#fn-near)" style="stroke: var(--chart-status-warning);"></path><circle cx="367.6" cy="601" r="3.5" fill="none" stroke-width="1.75" style="stroke: var(--chart-status-warning);"></circle><line x1="406" x2="406" y1="630" y2="644" stroke-width="3.5" style="stroke: var(--chart-status-warning);"></line><path d="M316.4 583 C356.4 583 414.2 655 454.2 655" fill="none" stroke-width="1.5" marker-end="url(#fn-far)" style="stroke: var(--chart-status-good);"></path><circle cx="316.4" cy="583" r="3.5" fill="none" stroke-width="1.75" style="stroke: var(--chart-status-good);"></circle><line x1="457.2" x2="457.2" y1="648" y2="662" stroke-width="3.5" style="stroke: var(--chart-status-good);"></line><path d="M470 637 C489.2 637 486.2 673 505.4 673" fill="none" stroke-width="1.5" marker-end="url(#fn-near)" style="stroke: var(--chart-status-warning);"></path><circle cx="470" cy="637" r="3.5" fill="none" stroke-width="1.75" style="stroke: var(--chart-status-warning);"></circle><line x1="508.4" x2="508.4" y1="666" y2="680" stroke-width="3.5" style="stroke: var(--chart-status-warning);"></line><line x1="638.8" x2="638.8" y1="534" y2="688" stroke-width="1" stroke-dasharray="2 4" style="stroke: var(--text-secondary);"></line><text x="644.8" y="546" font-size="11" style="fill: var(--text-secondary);">(default)</text><line x1="572.4" x2="572.4" y1="534" y2="688" stroke-width="1.5" stroke-dasharray="4 3" style="stroke: var(--text-primary);"></line><text x="566.4" y="546" text-anchor="end" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">done earlier</text><path d="M576.4 562L634.8 562" fill="none" stroke-width="1.25" marker-start="url(#fn-sv)" marker-end="url(#fn-sv)" style="stroke: var(--text-secondary);"></path><text x="605.6" y="577" text-anchor="middle" font-size="11" style="fill: var(--text-secondary);">saved</text><text x="24" y="610" font-size="11.5" style="fill: var(--text-secondary);">far passes start</text><text x="24" y="626" font-size="11.5" style="fill: var(--text-secondary);">early, near passes</text><text x="24" y="642" font-size="11.5" style="fill: var(--text-secondary);">wait only for theirs</text></g><g><line x1="150" x2="730" y1="704" y2="704" stroke-width="1.25" style="stroke: var(--chart-axis);"></line><text x="730" y="696" text-anchor="end" font-size="11.5" style="fill: var(--text-secondary);">time</text></g><circle cx="156" cy="738" r="3.5" fill="none" stroke-width="1.75" style="stroke: var(--text-secondary);"></circle><text x="168" y="742" font-size="11" style="fill: var(--text-primary);">begin: signal right after the producer</text><line x1="410" x2="410" y1="731" y2="745" stroke-width="3.5" style="stroke: var(--text-secondary);"></line><text x="422" y="742" font-size="11" style="fill: var(--text-primary);">wait: right before the consumer starts</text><line x1="150" x2="162" y1="760" y2="760" stroke-width="2" style="stroke: var(--chart-status-good);"></line><text x="168" y="764" font-size="11" style="fill: var(--text-primary);">far barrier (begins early, wait is usually free)</text><line x1="404" x2="416" y1="760" y2="760" stroke-width="2" style="stroke: var(--chart-status-warning);"></line><text x="422" y="764" font-size="11" style="fill: var(--text-primary);">near barrier (depends on the previous batch)</text></svg>