<svg viewBox="0 0 760 500" role="img" aria-label="Moving compute pass C1 two batches later keeps all dependencies, removes two subchannel switches and shortens the lifetime of X" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" width="760" height="500"><style>svg{--text-primary:rgb(11, 11, 11);--text-secondary:rgb(82, 81, 78);--chart-status-warning:rgb(250, 178, 25);--chart-status-good:rgb(12, 163, 12);--chart-grid:rgba(11,11,11,0.1);--chart-axis:rgb(195, 194, 183);--chart-categorical-1:rgb(42, 120, 214);--chart-categorical-2:rgb(235, 104, 52);--chart-categorical-3:rgb(27, 175, 122)}@media (prefers-color-scheme:dark){svg{--text-primary:rgb(240, 239, 236);--text-secondary:rgb(195, 194, 183);--chart-status-warning:rgb(250, 178, 25);--chart-status-good:rgb(12, 163, 12);--chart-grid:rgba(255,255,255,0.1);--chart-axis:rgb(56, 56, 53);--chart-categorical-1:rgb(57, 135, 229);--chart-categorical-2:rgb(217, 89, 38);--chart-categorical-3:rgb(25, 158, 112)}}</style><text x="24" y="30" font-size="15" font-weight="600" style="fill: var(--text-primary);">Wiggling C1 into a compute batch</text><text x="24" y="50" font-size="11.5" style="fill: var(--text-secondary);">Same batches, same barriers. X is only read by a later pass, so C1 can move freely.</text><g><circle cx="196" cy="71" r="5" style="fill: var(--chart-status-warning);"></circle><text x="208" y="75" font-size="11.5" style="fill: var(--text-primary);">subchannel switch</text><rect x="340" y="65" width="22" height="12" rx="6" fill-opacity="0.12" style="fill: var(--chart-status-good);"></rect><text x="370" y="75" font-size="11.5" style="fill: var(--text-primary);">lifetime of X</text></g><g><text x="24" y="126" font-weight="600" style="fill: var(--text-primary);">After reordering</text><text x="24" y="144" font-size="11.5" font-weight="600" style="fill: var(--chart-status-warning);">3 switches</text><text x="248" y="92" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">Batch 0</text><text x="464" y="92" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">Batch 1</text><text x="632" y="92" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">Batch 2</text><line x1="150" x2="740" y1="178" y2="178" stroke-width="2" style="stroke: var(--chart-grid);"></line><line x1="150" x2="740" y1="206" y2="206" stroke-width="2" style="stroke: var(--chart-grid);"></line><line x1="150" x2="740" y1="234" y2="234" stroke-width="2" style="stroke: var(--chart-grid);"></line><rect x="284" y="221" width="440" height="26" rx="13" fill-opacity="0.12" style="fill: var(--chart-status-good);"></rect><text x="128" y="182" text-anchor="end" style="fill: var(--text-primary);">A</text><text x="128" y="210" text-anchor="end" style="fill: var(--text-primary);">B</text><text x="128" y="238" text-anchor="end" style="fill: var(--text-primary);">X</text><rect x="351" y="102" width="10" height="134" rx="3" fill-opacity="0.25" style="fill: var(--chart-axis); stroke: var(--chart-axis);"></rect><rect x="567" y="102" width="10" height="134" rx="3" fill-opacity="0.25" style="fill: var(--chart-axis); stroke: var(--chart-axis);"></rect><rect x="160" y="112" width="80" height="36" rx="8" fill-opacity="0.18" stroke-width="1.5" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><rect x="256" y="112" width="80" height="36" rx="8" fill-opacity="0.18" stroke-width="1.5" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><rect x="376" y="112" width="80" height="36" rx="8" fill-opacity="0.18" stroke-width="1.5" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><rect x="472" y="112" width="80" height="36" rx="8" fill-opacity="0.18" stroke-width="1.5" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><rect x="592" y="112" width="80" height="36" rx="