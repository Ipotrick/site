<svg viewBox="0 0 760 560" role="img" aria-label="With a normal barrier P3 waits for the long pass P2; with a split barrier P3 only waits for P1, overlaps P2, and the work finishes earlier" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" width="760" height="560"><style>svg{--text-primary:rgb(11, 11, 11);--text-secondary:rgb(82, 81, 78);--chart-categorical-1:rgb(42, 120, 214);--chart-categorical-2:rgb(235, 104, 52);--chart-categorical-3:rgb(27, 175, 122);--chart-status-critical:rgb(208, 59, 59);--chart-status-warning:rgb(250, 178, 25);--chart-grid:rgba(11,11,11,0.1);--chart-status-good:rgb(12, 163, 12);--chart-axis:rgb(195, 194, 183)}@media (prefers-color-scheme:dark){svg{--text-primary:rgb(240, 239, 236);--text-secondary:rgb(195, 194, 183);--chart-categorical-1:rgb(57, 135, 229);--chart-categorical-2:rgb(217, 89, 38);--chart-categorical-3:rgb(25, 158, 112);--chart-status-critical:rgb(208, 59, 59);--chart-status-warning:rgb(250, 178, 25);--chart-grid:rgba(255,255,255,0.1);--chart-status-good:rgb(12, 163, 12);--chart-axis:rgb(56, 56, 53)}}</style><text x="24" y="30" font-size="15" font-weight="600" style="fill: var(--text-primary);">Normal barrier and split barrier</text><text x="24" y="50" font-size="11.5" style="fill: var(--text-secondary);">Illustrative. Batches: P1 + P2, then P3, then P4. P3 only needs A from P1.</text><g><rect x="190" y="64" width="14" height="10" rx="2" fill-opacity="0.35" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="210" y="73" font-size="11.5" style="fill: var(--text-primary);">P1 writes A</text><rect x="300" y="64" width="14" height="10" rx="2" fill-opacity="0.35" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><text x="320" y="73" font-size="11.5" style="fill: var(--text-primary);">P2 writes B</text><rect x="410" y="64" width="14" height="10" rx="2" fill-opacity="0.35" style="fill: var(--chart-categorical-3); stroke: var(--chart-categorical-3);"></rect><text x="430" y="73" font-size="11.5" style="fill: var(--text-primary);">P3 reads A</text><rect x="520" y="64" width="14" height="10" rx="2" fill-opacity="0.35" style="fill: var(--text-secondary); stroke: var(--text-secondary);"></rect><text x="540" y="73" font-size="11.5" style="fill: var(--text-primary);">P4 reads B, C</text></g><g><text x="24" y="152" font-weight="600" style="fill: var(--text-primary);">Normal barriers</text><text x="24" y="170" font-size="11.5" style="fill: var(--chart-status-critical);">P3 also waits for P2</text><g><rect x="190" y="96" width="95.39999999999998" height="10" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><rect x="200.6" y="110" width="95.4" height="10" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><rect x="190" y="124" width="265" height="10" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><rect x="205.9" y="138" width="275.6" height="10" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><rect x="216.5" y="152" width="249.10000000000002" height="10" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><rect x="508" y="166" width="106" height="10" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--chart-categorical-3); stroke: var(--chart-categorical-3);"></rect><rect x="518.6" y="180" width="111.29999999999995" height="10" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--chart-categorical-3); stroke: var(--chart-categorical-3);"></rect><rect x="645.8" y="194" width="58.30000000000007" height="10" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--text-secondary); stroke: var(--text-secondary);"></rect><rect x="651.1" y="208" width="68.89999999999998" height="10" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--text-secondary); stroke: var(--text-secondary);"></rect></g><rect x="491.75" y="90" width="6" height="138" rx="2" fill-opacity="0.5" style="fill: var(--chart-status-warning); stroke: var(--chart-status-warning);"></rect><rect x="634.8499999999999" y="90" width="6" height="138" rx="2" fill-opacity="0.5" style="fill: var(--chart-status-warning); stroke: var(--chart-status-warning);"></rect><text x="494.75" y="84" text-anchor="middle" font-size="11" style="fill: var(--text-primary);">A</text><text x="637.8499999999999" y="84" text-anchor="middle" font-size="11" style="fill: var(--text-primary);">B + C</text><g><line x1="190" x2="720" y1="270" y2="270" style="stroke: var(--chart-grid);"></line><line x1="190" x2="720" y1="234" y2="234" stroke-dasharray="2 3" style="stroke: var(--chart-grid);"></line><text x="184" y="238" text-anchor="end" font-size="10.5" style="fill: var(--text-secondary);">full</text></g><path d="M190 270L200.6 255.6L285.4 255.6L296 270Z" fill-opacity="0.35" stroke-width="1.25" stroke-linejoin="round" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></path><path d="M190 270L205.9 234L285.4 234L296 248.4L455 248.4L481.5 270L296 270L285.4 255.6L200.6 255.6Z" fill-opacity="0.35" stroke-width="1.25" stroke-linejoin="round" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></path><path d="M508 270L518.6 248.4L614 248.4L629.9 270Z" fill-opacity="0.35" stroke-width="1.25" stroke-linejoin="round" style="fill: var(--chart-categorical-3); stroke: var(--chart-categorical-3);"></path><path d="M645.8 270L656.4 248.4L704.1 248.4L720 270Z" fill-opacity="0.35" stroke-width="1.25" stroke-linejoin="round" style="fill: var(--text-secondary); stroke: var(--text-secondary);"></path></g><g><text x="24" y="372" font-weight="600" style="fill: var(--text-primary);">Split barrier for A</text><text x="24" y="390" font-size="11.5" style="fill: var(--chart-status-good);">P3 only waits for P1</text><g><rect x="190" y="316" width="95.39999999999998" height="10" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><rect x="200.6" y="330" width="95.4" height="10" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><rect x="190" y="344" width="265" height="10" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><rect x="205.9" y="358" width="275.6" height="10" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><rect x="216.5" y="372" width="249.10000000000002" height="10" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><rect x="306.6" y="386" width="106" height="10" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--chart-categorical-3); stroke: var(--chart-categorical-3);"></rect><rect x="317.2" y="400" width="111.30000000000001" height="10" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--chart-categorical-3); stroke: var(--chart-categorical-3);"></rect><rect x="508" y="414" width="58.299999999999955" height="10" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--text-secondary); stroke: var(--text-secondary);"></rect><rect x="513.3" y="428" width="68.90000000000009" height="10" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--text-secondary); stroke: var(--text-secondary);"></rect></g><rect x="298.3" y="310" width="6" height="138" rx="2" fill-opacity="0.5" style="fill: var(--chart-status-good); stroke: var(--chart-status-good);"></rect><rect x="491.75" y="310" width="6" height="138" rx="2" fill-opacity="0.5" style="fill: var(--chart-status-warning); stroke: var(--chart-status-warning);"></rect><text x="301.3" y="304" text-anchor="middle" font-size="11" style="fill: var(--text-primary);">begin + end A</text><text x="494.75" y="304" text-anchor="middle" font-size="11" style="fill: var(--text-primary);">B + C</text><g><line x1="190" x2="720" y1="490" y2="490" style="stroke: var(--chart-grid);"></line><line x1="190" x2="720" y1="454" y2="454" stroke-dasharray="2 3" style="stroke: var(--chart-grid);"></line><text x="184" y="458" text-anchor="end" font-size="10.5" style="fill: var(--text-secondary);">full</text></g><path d="M190 490L200.6 475.6L285.4 475.6L296 490Z" fill-opacity="0.35" stroke-width="1.25" stroke-linejoin="round" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></path><path d="M190 490L205.9 454L285.4 454L296 468.4L455 468.4L481.5 490L296 490L285.4 475.6L200.6 475.6Z" fill-opacity="0.35" stroke-width="1.25" stroke-linejoin="round" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></path><path d="M306.6 468.4L317.2 454L412.6 454L428.5 468.4Z" fill-opacity="0.35" stroke-width="1.25" stroke-linejoin="round" style="fill: var(--chart-categorical-3); stroke: var(--chart-categorical-3);"></path><path d="M508 490L518.6 468.4L571.5999999999999 468.4L582.2 490Z" fill-opacity="0.35" stroke-width="1.25" stroke-linejoin="round" style="fill: var(--text-secondary); stroke: var(--text-secondary);"></path><line x1="582.2" x2="582.2" y1="312" y2="494" stroke-width="1.5" stroke-dasharray="4 3" style="stroke: var(--chart-status-good);"></line><text x="588.2" y="324" font-size="11.5" font-weight="600" style="fill: var(--chart-status-good);">done earlier</text></g><g><line x1="190" x2="720" y1="546" y2="546" stroke-width="1.25" style="stroke: var(--chart-axis);"></line><text x="720" y="538" text-anchor="end" font-size="11.5"