<svg viewBox="0 0 760 370" role="img" aria-label="Scheduling as early as possible, one pass at a time" font-size="12" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" width="760" height="370"><style>svg{--text-primary:rgb(11, 11, 11);--text-secondary:rgb(82, 81, 78);--chart-grid:rgba(11,11,11,0.1);--chart-categorical-1:rgb(42, 120, 214);--chart-axis:rgb(195, 194, 183)}@media (prefers-color-scheme:dark){svg{--text-primary:rgb(240, 239, 236);--text-secondary:rgb(195, 194, 183);--chart-grid:rgba(255,255,255,0.1);--chart-categorical-1:rgb(57, 135, 229);--chart-axis:rgb(56, 56, 53)}}</style><text x="24" y="30" font-size="15" font-weight="600" style="fill: var(--text-primary);">Scheduling the two chains, one pass at a time</text><g><text x="520" y="76" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">Batch 0</text><text x="650" y="76" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">Batch 1</text><line x1="585" x2="585" y1="84" y2="356" style="stroke: var(--chart-grid);"></line></g><g><text x="24" y="108" font-size="13" font-weight="600" style="fill: var(--text-primary);">1. GBuf: no earlier access</text><text x="24" y="126" font-size="11.5" style="fill: var(--text-secondary);">free, so the first batch: batch 0</text><rect x="472" y="92" width="96" height="22" rx="6" fill-opacity="0.18" stroke-width="2" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="520" y="107" text-anchor="middle" style="fill: var(--text-primary);">GBuf</text></g><g><text x="24" y="176" font-size="13" font-weight="600" style="fill: var(--text-primary);">2. AO: last write to the gbuffer is GBuf</text><text x="24" y="194" font-size="11.5" style="fill: var(--text-secondary);">needs a barrier, so after batch 0: new batch 1</text><rect x="472" y="160" width="96" height="22" rx="6" fill="none" fill-opacity="1" stroke-width="1" style="stroke: var(--chart-axis);"></rect><rect x="602" y="160" width="96" height="22" rx="6" fill-opacity="0.18" stroke-width="2" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="520" y="175" text-anchor="middle" style="fill: var(--text-primary);">GBuf</text><text x="650" y="175" text-anchor="middle" style="fill: var(--text-primary);">AO</text></g><g><text x="24" y="244" font-size="13" font-weight="600" style="fill: var(--text-primary);">3. Cull: no earlier access to the light list</text><text x="24" y="262" font-size="11.5" style="fill: var(--text-secondary);">free again: back into batch 0, next to GBuf</text><rect x="472" y="228" width="96" height="22" rx="6" fill="none" fill-opacity="1" stroke-width="1" style="stroke: var(--chart-axis);"></rect><rect x="602" y="228" width="96" height="22" rx="6" fill="none" fill-opacity="1" stroke-width="1" style="stroke: var(--chart-axis);"></rect><rect x="472" y="256" width="96" height="22" rx="6" fill-opacity="0.18" stroke-width="2" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="520" y="243" text-anchor="middle" style="fill: var(--text-primary);">GBuf</text><text x="650" y="243" text-anchor="middle" style="fill: var(--text-primary);">AO</text><text x="520" y="271" text-anchor="middle" style="fill: var(--text-primary);">Cull</text></g><g><text x="24" y="312" font-size="13" font-weight="600" style="fill: var(--text-primary);">4. Shadow: last write to the light list is Cull</text><text x="24" y="330" font-size="11.5" style="fill: var(--text-secondary);">after batch 0: batch 1, which already exists. Done, 2 batches</text><rect x="472" y="296" width="96" height="22" rx="6" fill="none" fill-opacity="1" stroke-width="1" style="stroke: var(--chart-axis);"></rect><rect x="602" y="296" width="96" height="22" rx="6" fill="none" fill-opacity="1" stroke-width="1" style="stroke: var(--chart-axis);"></rect><rect x="472" y="324" width="96" height="22" rx="6" fill="none" fill-opacity="1" stroke-width="1" style="stroke: var(--chart-axis);"></rect><rect x="602" y="324" width="96" height="22" rx="6" fill-opacity="0.18" stroke-width="2" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="520" y="311" text-anchor="middle" style="fill: var(--text-primary);">GBuf</text><text x="650" y="311" text-anchor="middle" style="fill: var(--text-primary);">AO</text><text x="520" y="339" text-anchor="middle" style="fill: var(--text-primary);">Cull</text><text x="650" y="339" text-anchor="middle" style="fill: var(--text-primary);">Shadow</text></g></svg>