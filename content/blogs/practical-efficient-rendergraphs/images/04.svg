<svg viewBox="0 0 760 200" role="img" aria-label="The driver inserts a barrier between the render pass and the compute pass" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" width="760" height="200"><defs><marker id="bar-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="rgb(195, 194, 183)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="rgb(11, 11, 11)">A barrier inserted by the D3D11 driver</text><g fill="none" stroke="rgb(195, 194, 183)" stroke-width="1.25"><path d="M230 110H320" marker-end="url(#bar-arrow)"></path><path d="M440 110H530" marker-end="url(#bar-arrow)"></path></g><g><rect x="30" y="78" width="200" height="64" rx="8" fill="none" stroke="rgb(195, 194, 183)" stroke-width="1.25"></rect><text x="130" y="106" text-anchor="middle" font-weight="600" fill="rgb(11, 11, 11)">Render pass</text><text x="130" y="126" text-anchor="middle" font-size="11.5" fill="rgb(82, 81, 78)">writes color image</text></g><g><rect x="320" y="78" width="120" height="64" rx="8" fill="rgb(42, 120, 214)" fill-opacity="0.12" stroke="rgb(42, 120, 214)" stroke-width="2"></rect><text x="380" y="106" text-anchor="middle" font-weight="600" fill="rgb(11, 11, 11)">Barrier</text><text x="380" y="126" text-anchor="middle" font-size="11.5" fill="rgb(82, 81, 78)">wait + flush</text></g><g><rect x="530" y="78" width="200" height="64" rx="8" fill="none" stroke="rgb(195, 194, 183)" stroke-width="1.25"></rect><text x="630" y="106" text-anchor="middle" font-weight="600" fill="rgb(11, 11, 11)">Compute pass</text><text x="630" y="126" text-anchor="middle" font-size="11.5" fill="rgb(82, 81, 78)">reads color image</text></g><text x="380" y="170" text-anchor="middle" font-size="11.5" fill="rgb(82, 81, 78)">inserted by the driver, never recorded by you</text></svg>