<svg viewBox="0 0 760 200" role="img" aria-label="The driver inserts a barrier between the render pass and the compute pass" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" width="760" height="200"><style>svg{--chart-axis:rgb(195, 194, 183);--text-primary:rgb(11, 11, 11);--text-secondary:rgb(82, 81, 78);--chart-categorical-1:rgb(42, 120, 214)}@media (prefers-color-scheme:dark){svg{--chart-axis:rgb(56, 56, 53);--text-primary:rgb(240, 239, 236);--text-secondary:rgb(195, 194, 183);--chart-categorical-1:rgb(57, 135, 229)}}</style><defs><marker id="bar-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill: var(--chart-axis);"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" style="fill: var(--text-primary);">A barrier inserted by the D3D11 driver</text><g fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"><path d="M230 110H320" marker-end="url(#bar-arrow)"></path><path d="M440 110H530" marker-end="url(#bar-arrow)"></path></g><g><rect x="30" y="78" width="200" height="64" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><text x="130" y="106" text-anchor="middle" font-weight="600" style="fill: var(--text-primary);">Render pass</text><text x="130" y="126" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">writes color image</text></g><g><rect x="320" y="78" width="120" height="64" rx="8" fill-opacity="0.12" stroke-width="2" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="380" y="106" text-anchor="middle" font-weight="600" style="fill: var(--text-primary);">Barrier</text><text x="380" y="126" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">wait + flush</text></g><g><rect x="530" y="78" width="200" height="64" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><text x="630" y="106" text-anchor="middle" font-weight="600" style="fill: var(--text-primary);">Compute pass</text><text x="630" y="126" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">reads color image</text></g><text x="380" y="170" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">inserted by the driver, never recorded by you</text></svg>