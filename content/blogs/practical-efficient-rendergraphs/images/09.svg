<svg viewBox="0 0 760 300" role="img" aria-label="The pass graph the timelines imply: GBuf to AO to Denoise to Light, Cull to Shadow to Vol and Light, Vol and Light to Post" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" width="760" height="300"><style>svg{--chart-axis:rgb(195, 194, 183);--text-primary:rgb(11, 11, 11);--text-secondary:rgb(82, 81, 78);--chart-categorical-1:rgb(42, 120, 214);--chart-categorical-2:rgb(235, 104, 52);--chart-categorical-3:rgb(27, 175, 122);--chart-categorical-4:rgb(237, 161, 0);--chart-categorical-5:rgb(232, 123, 164);--chart-categorical-6:rgb(0, 131, 0);--chart-categorical-7:rgb(98, 80, 214)}@media (prefers-color-scheme:dark){svg{--chart-axis:rgb(56, 56, 53);--text-primary:rgb(240, 239, 236);--text-secondary:rgb(195, 194, 183);--chart-categorical-1:rgb(57, 135, 229);--chart-categorical-2:rgb(217, 89, 38);--chart-categorical-3:rgb(25, 158, 112);--chart-categorical-4:rgb(201, 133, 0);--chart-categorical-5:rgb(213, 81, 129);--chart-categorical-6:rgb(12, 163, 12);--chart-categorical-7:rgb(144, 133, 233)}}</style><defs><marker id="pg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill: var(--chart-axis);"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" style="fill: var(--text-primary);">The pass graph, implied by the timelines</text><text x="24" y="50" font-size="11.5" style="fill: var(--text-secondary);">Each edge is a step back to a write, coloured by resource. Edges implied through other passes are left out.</text><g fill="none" stroke-width="2"><path d="M130 120H188" marker-end="url(#pg-a)" style="stroke: var(--chart-categorical-1);"></path><path d="M270 120H328" marker-end="url(#pg-a)" style="stroke: var(--chart-categorical-2);"></path><path d="M410 120H430V172H468" marker-end="url(#pg-a)" style="stroke: var(--chart-categorical-3);"></path><path d="M130 240H188" marker-end="url(#pg-a)" style="stroke: var(--chart-categorical-4);"></path><path d="M270 240H328" marker-end="url(#pg-a)" style="stroke: var(--chart-categorical-5);"></path><path d="M270 240H290V188H468" marker-end="url(#pg-a)" style="stroke: var(--chart-categorical-5);"></path><path d="M410 240H580V188H608" marker-end="url(#pg-a)" style="stroke: var(--chart-categorical-6);"></path><path d="M550 180H608" marker-end="url(#pg-a)" style="stroke: var(--chart-categorical-7);"></path></g><g font-size="11"><text x="160" y="112" text-anchor="middle" style="fill: var(--chart-categorical-1);">gbuffer</text><text x="300" y="112" text-anchor="middle" style="fill: var(--chart-categorical-2);">ao</text><text x="446" y="112" text-anchor="middle" style="fill: var(--chart-categorical-3);">ao_denoised</text><text x="160" y="262" text-anchor="middle" style="fill: var(--chart-categorical-4);">light_list</text><text x="300" y="262" text-anchor="middle" style="fill: var(--chart-categorical-5);">shadow_maps</text><text x="510" y="258" text-anchor="middle" style="fill: var(--chart-categorical-6);">froxels</text><text x="580" y="172" text-anchor="middle" style="fill: var(--chart-categorical-7);">hdr</text></g><g><g><rect x="50" y="102" width="80" height="36" rx="8" fill="none" stroke-width="1.5" style="stroke: var(--chart-axis);"></rect><text x="90" y="125" text-anchor="middle" font-weight="600" style="fill: var(--text-primary);">GBuf</text></g><g><rect x="190" y="102" width="80" height="36" rx="8" fill="none" stroke-width="1.5" style="stroke: var(--chart-axis);"></rect><text x="230" y="125" text-anchor="middle" font-weight="600" style="fill: var(--text-primary);">AO</text></g><g><rect x="330" y="102" width="80" height="36" rx="8" fill="none" stroke-width="1.5" style="stroke: var(--chart-axis);"></rect><text x="370" y="125" text-anchor="middle" font-weight="600" style="fill: var(--text-primary);">Denoise</text></g><g><rect x="50" y="222" width="80" height="36" rx="8" fill="none" stroke-width="1.5" style="stroke: var(--chart-axis);"></rect><text x="90" y="245" text-anchor="middle" font-weight="600" style="fill: var(--text-primary);">Cull</text></g><g><rect x="190" y="222" width="80" height="36" rx="8" fill="none" stroke-width="1.5" style="stroke: var(--chart-axis);"></rect><text x="230" y="245" text-anchor="middle" font-weight="600" style="fill: var(--text-primary);">Shadow</text></g><g><rect x="330" y="222" width="80" height="36" rx="8" fill="none" stroke-width="1.5" style="stroke: var(--chart-axis);"></rect><text x="370" y="245" text-anchor="middle" font-weight="600" style="fill: var(--text-primary);">Vol</text></g><g><rect x="470" y="162" width="80" height="36" rx="8" fill="none" stroke-width="1.5" style="stroke: var(--chart-axis);"></rect><text x="510" y="185" text-anchor="middle" font-weight="600" style="fill: var(--text-primary);">Light</text></g><g><rect x="610" y="162" width="80" height="36" rx="8" fill="none" stroke-width="1.5" style="stroke: var(--chart-axis);"></rect><text x="650" y="185" text-anchor="middle" font-weight="600" style="fill: var(--text-primary);">Post</text></g></g></svg>