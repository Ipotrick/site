<svg viewBox="0 0 760 300" role="img" aria-label="The pass graph the timelines imply: GBuf to AO to Denoise to Light, Cull to Shadow to Vol and Light, Vol and Light to Post" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" width="760" height="300"><defs><marker id="pg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="rgb(195, 194, 183)"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="rgb(11, 11, 11)">The pass graph, implied by the timelines</text><text x="24" y="50" font-size="11.5" fill="rgb(82, 81, 78)">Each edge is a step back to a write, coloured by resource. Edges implied through other passes are left out.</text><g fill="none" stroke-width="2"><path d="M130 120H188" stroke="rgb(42, 120, 214)" marker-end="url(#pg-a)"></path><path d="M270 120H328" stroke="rgb(235, 104, 52)" marker-end="url(#pg-a)"></path><path d="M410 120H430V172H468" stroke="rgb(27, 175, 122)" marker-end="url(#pg-a)"></path><path d="M130 240H188" stroke="rgb(237, 161, 0)" marker-end="url(#pg-a)"></path><path d="M270 240H328" stroke="rgb(232, 123, 164)" marker-end="url(#pg-a)"></path><path d="M270 240H290V188H468" stroke="rgb(232, 123, 164)" marker-end="url(#pg-a)"></path><path d="M410 240H580V188H608" stroke="rgb(0, 131, 0)" marker-end="url(#pg-a)"></path><path d="M550 180H608" stroke="rgb(98, 80, 214)" marker-end="url(#pg-a)"></path></g><g font-size="11"><text x="160" y="112" text-anchor="middle" fill="rgb(42, 120, 214)">gbuffer</text><text x="300" y="112" text-anchor="middle" fill="rgb(235, 104, 52)">ao</text><text x="446" y="112" text-anchor="middle" fill="rgb(27, 175, 122)">ao_denoised</text><text x="160" y="262" text-anchor="middle" fill="rgb(237, 161, 0)">light_list</text><text x="300" y="262" text-anchor="middle" fill="rgb(232, 123, 164)">shadow_maps</text><text x="510" y="258" text-anchor="middle" fill="rgb(0, 131, 0)">froxels</text><text x="580" y="172" text-anchor="middle" fill="rgb(98, 80, 214)">hdr</text></g><g><g><rect x="50" y="102" width="80" height="36" rx="8" fill="none" stroke="rgb(195, 194, 183)" stroke-width="1.5"></rect><text x="90" y="125" text-anchor="middle" font-weight="600" fill="rgb(11, 11, 11)">GBuf</text></g><g><rect x="190" y="102" width="80" height="36" rx="8" fill="none" stroke="rgb(195, 194, 183)" stroke-width="1.5"></rect><text x="230" y="125" text-anchor="middle" font-weight="600" fill="rgb(11, 11, 11)">AO</text></g><g><rect x="330" y="102" width="80" height="36" rx="8" fill="none" stroke="rgb(195, 194, 183)" stroke-width="1.5"></rect><text x="370" y="125" text-anchor="middle" font-weight="600" fill="rgb(11, 11, 11)">Denoise</text></g><g><rect x="50" y="222" width="80" height="36" rx="8" fill="none" stroke="rgb(195, 194, 183)" stroke-width="1.5"></rect><text x="90" y="245" text-anchor="middle" font-weight="600" fill="rgb(11, 11, 11)">Cull</text></g><g><rect x="190" y="222" width="80" height="36" rx="8" fill="none" stroke="rgb(195, 194, 183)" stroke-width="1.5"></rect><text x="230" y="245" text-anchor="middle" font-weight="600" fill="rgb(11, 11, 11)">Shadow</text></g><g><rect x="330" y="222" width="80" height="36" rx="8" fill="none" stroke="rgb(195, 194, 183)" stroke-width="1.5"></rect><text x="370" y="245" text-anchor="middle" font-weight="600" fill="rgb(11, 11, 11)">Vol</text></g><g><rect x="470" y="162" width="80" height="36" rx="8" fill="none" stroke="rgb(195, 194, 183)" stroke-width="1.5"></rect><text x="510" y="185" text-anchor="middle" font-weight="600" fill="rgb(11, 11, 11)">Light</text></g><g><rect x="610" y="162" width="80" height="36" rx="8" fill="none" stroke="rgb(195, 194, 183)" stroke-width="1.5"></rect><text x="650" y="185" text-anchor="middle" font-weight="600" fill="rgb(11, 11, 11)">Post</text></g></g></svg>