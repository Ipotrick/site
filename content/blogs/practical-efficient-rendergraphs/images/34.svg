<svg viewBox="0 0 760 480" role="img" aria-label="GPU occupancy over time for six passes in three batches. With one barrier per batch, the two passes inside a batch hand over smoothly, but between batches the next batch waits for the whole previous batch, so the occupancy drains at each barrier. With split barriers each pass starts when the previous one is 80 percent complete, the two cross-fade, and the occupancy stays full, so the work finishes earlier. Bands show which pass holds which share of the GPU." font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" width="760" height="480"><style>svg{--chart-status-critical:rgb(208, 59, 59);--text-primary:rgb(11, 11, 11);--text-secondary:rgb(82, 81, 78);--chart-categorical-1:rgb(42, 120, 214);--chart-categorical-2:rgb(235, 104, 52);--chart-categorical-3:rgb(27, 175, 122);--chart-categorical-4:rgb(237, 161, 0);--chart-categorical-5:rgb(232, 123, 164);--chart-categorical-6:rgb(0, 131, 0);--chart-axis:rgb(195, 194, 183);--chart-grid:rgba(11,11,11,0.1)}@media (prefers-color-scheme:dark){svg{--chart-status-critical:rgb(208, 59, 59);--text-primary:rgb(240, 239, 236);--text-secondary:rgb(195, 194, 183);--chart-categorical-1:rgb(57, 135, 229);--chart-categorical-2:rgb(217, 89, 38);--chart-categorical-3:rgb(25, 158, 112);--chart-categorical-4:rgb(201, 133, 0);--chart-categorical-5:rgb(213, 81, 129);--chart-categorical-6:rgb(12, 163, 12);--chart-axis:rgb(56, 56, 53);--chart-grid:rgba(255,255,255,0.1)}}</style><defs><marker id="oc-sv" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill: var(--text-secondary);"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" style="fill: var(--text-primary);">GPU occupancy with and without split barriers</text><text x="24" y="50" font-size="11.5" style="fill: var(--text-secondary);">Illustrative. Each band is one pass, stacked in launch order. Batches are P1+P2, P3+P4, P5+P6. Red is unused GPU.</text><text x="24" y="100" font-weight="600" style="fill: var(--text-primary);">1. One barrier per batch</text><line x1="150" x2="730" y1="130" y2="130" stroke-width="1" stroke-dasharray="2 3" style="stroke: var(--chart-grid);"></line><text x="144" y="134" text-anchor="end" font-size="10.5" style="fill: var(--text-secondary);">full</text><line x1="150" x2="730" y1="240" y2="240" stroke-width="1.25" style="stroke: var(--chart-axis);"></line><path d="M280 134.2L282 146.1L284 164L286 185L288 206L290 223.9L292 235.8L294 240L296 240L298 240L300 240L302 240L304 235.8L306 223.9L308 206L310 185L312 164L314 146.1L316 134.2L316 130L314 130L312 130L310 130L308 130L306 130L304 130L302 130L300 130L298 130L296 130L294 130L292 130L290 130L288 130L286 130L284 130L282 130L280 130Z" style="fill: var(--chart-status-critical);" fill-opacity="0.16" stroke="none"></path><path d="M432 134.2L434 146.1L436 164L438 185L440 206L442 223.9L444 235.8L446 240L448 240L450 240L452 240L454 240L456 235.8L458 223.9L460 206L462 185L464 164L466 146.1L468 134.2L468 130L466 130L464 130L462 130L460 130L458 130L456 130L454 130L452 130L450 130L448 130L446 130L444 130L442 130L440 130L438 130L436 130L434 130L432 130Z" style="fill: var(--chart-status-critical);" fill-opacity="0.16" stroke="none"></path><path d="M152 235.8L154 223.9L156 206L160 164L162 146.1L164 134.2L166 130L214 130L216 134.2L218 146.1L220 164L224 206L226 223.9L228 235.8L228 240L226 240L224 240L220 240L218 240L216 240L214 240L166 240L164 240L162 240L160 240L156 240L154 240L152 240Z" fill-opacity="0.34" stroke-width="1.25" stroke-linejoin="round" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></path><text x="190" y="189" text-anchor="middle" font-size="11" font-weight="600" style="fill: var(--text-primary);">P1</text><path d="M216 130L218 130L220 130L224 130L226 130L228 130L230 130L278 130L280 134.2L282 146.1L284 164L288 206