style="fill: var(--text-secondary);">full</text><line x1="150" x2="730" y1="430" y2="430" stroke-width="1.25" style="stroke: var(--chart-axis);"></line><path d="M152 425.8L154 413.9L156 396L160 354L162 336.1L164 324.2L166 320L214 320L216 324.2L218 336.1L220 354L224 396L226 413.9L228 425.8L228 430L226 430L224 430L220 430L218 430L216 430L214 430L166 430L164 430L162 430L160 430L156 430L154 430L152 430Z" fill-opacity="0.34" stroke-width="1.25" stroke-linejoin="round" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></path><text x="190" y="379" text-anchor="middle" font-size="11" font-weight="600" style="fill: var(--text-primary);">P1</text><path d="M216 320L218 320L220 320L224 320L226 320L228 320L230 320L278 320L280 324.2L282 336.1L284 354L288 396L290 413.9L292 425.8L292 430L290 430L288 430L284 430L282 430L280 430L278 430L230 430L228 425.8L226 413.9L224 396L220 354L218 336.1L216 324.2Z" fill-opacity="0.34" stroke-width="1.25" stroke-linejoin="round" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></path><text x="254" y="379" text-anchor="middle" font-size="11" font-weight="600" style="fill: var(--text-primary);">P2</text><path d="M280 320L282 320L284 320L288 320L290 320L292 320L294 320L342 320L344 324.2L346 336.1L348 354L352 396L354 413.9L356 425.8L356 430L354 430L352 430L348 430L346 430L344 430L342 430L294 430L292 425.8L290 413.9L288 396L284 354L282 336.1L280 324.2Z" fill-opacity="0.34" stroke-width="1.25" stroke-linejoin="round" style="fill: var(--chart-categorical-3); stroke: var(--chart-categorical-3);"></path><text x="318" y="379" text-anchor="middle" font-size="11" font-weight="600" style="fill: var(--text-primary);">P3</text><path d="M344 320L346 320L348 320L352 320L354 320L356 320L358 320L406 320L408 324.2L410 336.1L412 354L416 396L418 413.9L420 425.8L420 430L418 430L416 430L412 430L410 430L408 430L406 430L358 430L356 425.8L354 413.9L352 396L348 354L346 336.1L344 324.2Z" fill-opacity="0.34" stroke-width=