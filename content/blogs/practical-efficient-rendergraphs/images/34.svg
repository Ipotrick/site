<svg viewBox="0 0 760 480" role="img" aria-label="GPU occupancy over time for a stream of six passes. With one barrier per batch each pass waits for the previous one to finish, so the occupancy drains to almost nothing at every barrier. With split barriers each pass starts when the previous one is 80 percent complete, the two cross-fade, and the occupancy stays full, so the work finishes earlier. Bands show which pass holds which share of the GPU." font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" width="760" height="480"><style>svg{--chart-status-critical:rgb(208, 59, 59);--text-primary:rgb(11, 11, 11);--text-secondary:rgb(82, 81, 78);--chart-categorical-1:rgb(42, 120, 214);--chart-categorical-2:rgb(235, 104, 52);--chart-categorical-3:rgb(27, 175, 122);--chart-categorical-4:rgb(237, 161, 0);--chart-categorical-5:rgb(232, 123, 164);--chart-categorical-6:rgb(0, 131, 0);--chart-axis:rgb(195, 194, 183);--chart-grid:rgba(11,11,11,0.1)}@media (prefers-color-scheme:dark){svg{--chart-status-critical:rgb(208, 59, 59);--text-primary:rgb(240, 239, 236);--text-secondary:rgb(195, 194, 183);--chart-categorical-1:rgb(57, 135, 229);--chart-categorical-2:rgb(217, 89, 38);--chart-categorical-3:rgb(25, 158, 112);--chart-categorical-4:rgb(201, 133, 0);--chart-categorical-5:rgb(213, 81, 129);--chart-categorical-6:rgb(12, 163, 12);--chart-axis:rgb(56, 56, 53);--chart-grid:rgba(255,255,255,0.1)}}</style><defs><marker id="oc-sv" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill: var(--text-secondary);"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" style="fill: var(--text-primary);">GPU occupancy with and without split barriers</text><text x="24" y="50" font-size="11.5" style="fill: var(--text-secondary);">Illustrative. Each band is one pass, stacked in launch order. Red is unused GPU. H