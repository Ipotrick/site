<svg viewBox="0 0 760 330" role="img" aria-label="Top: P1, P2 and P3 recorded in order, the dependencies on A form from that order. Bottom: the versioned style, where A0 and A1 are separate named versions that every pass has to refer to." font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" width="760" height="330"><style>svg{--chart-axis:rgb(195, 194, 183);--text-primary:rgb(11, 11, 11);--chart-status-good:rgb(12, 163, 12);--text-secondary:rgb(82, 81, 78);--chart-categorical-1:rgb(42, 120, 214);--chart-grid:rgba(11,11,11,0.1);--chart-status-critical:rgb(208, 59, 59);--chart-categorical-2:rgb(235, 104, 52)}@media (prefers-color-scheme:dark){svg{--chart-axis:rgb(56, 56, 53);--text-primary:rgb(240, 239, 236);--chart-status-good:rgb(12, 163, 12);--text-secondary:rgb(195, 194, 183);--chart-categorical-1:rgb(57, 135, 229);--chart-grid:rgba(255,255,255,0.1);--chart-status-critical:rgb(208, 59, 59);--chart-categorical-2:rgb(217, 89, 38)}}</style><defs><marker id="lv-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill: var(--chart-axis);"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" style="fill: var(--text-primary);">Dependencies from recording order vs named versions</text><g><text x="24" y="70" font-weight="600" style="fill: var(--chart-status-good);">Linear recording</text><text x="24" y="88" font-size="11.5" style="fill: var(--text-secondary);">passes only name A, the order does the rest</text><g><rect x="205" y="100" width="110" height="32" rx="8" fill-opacity="0.25" stroke-width="1.5" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="260" y="121" text-anchor="middle" font-weight="600" style="fill: var(--text-primary);">P1</text></g><g><rect x="405" y="100" width="110" height="32" rx="8" fill-opacity="0.25" stroke-width="1.5" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="460" y="121" text-anchor="middle" font-weight="600" style="fill: var(--text-primary);">P2</text></g><g><rect x="605" y="100" width="110" height="32" rx="8" fill-opacity="0.25" stroke-width="1.5" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="660" y="121" text-anchor="middle" font-weight="600" style="fill: var(--text-primary);">P3</text></g><line x1="316" x2="404" y1="116" y2="116" stroke-width="1.5" marker-end="url(#lv-a)" style="stroke: var(--chart-axis);"></line><line x1="516" x2="604" y1="116" y2="116" stroke-width="1.5" marker-end="url(#lv-a)" style="stroke: var(--chart-axis);"></line><text x="360" y="108" text-anchor="middle" font-size="11.5" style="fill: var(--text-primary);">A</text><text x="560" y="108" text-anchor="middle" font-size="11.5" style="fill: var(--text-primary);">A</text><text x="260" y="150" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">writes A</text><text x="460" y="150" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">reads + writes A</text><text x="660" y="150" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">reads A</text></g><line x1="24" x2="736" y1="188" y2="188" style="stroke: var(--chart-grid);"></line><g><text x="24" y="220" font-weight="600" style="fill: var(--chart-status-critical);">Versioned resources</text><text x="24" y="238" font-size="11.5" style="fill: var(--text-secondary);">every in-between state is a new name to pass around</text><g><rect x="138" y="250" width="84" height="32" rx="8" fill-opacity="0.25" stroke-width="1.5" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="180" y="271" text-anchor="middle" font-weight="600" style="fill: var(--text-primary);">P1</text></g><g><rect x="266" y="252" width="68" height="28" rx="14" fill-opacity="0.15" stroke-width="1.5" stroke-dasharray="4 3" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><text x="300" y="271" text-anchor="middle" font-weight="600" style="fill: var(--text-primary);">A₀</text></g><g><rect x="378" y="250" width="84" height="32" rx="8" fill-opacity="0.25" stroke-width="1.5" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="420" y="271" text-anchor="middle" font-weight="600" style="fill: var(--text-primary);">P2</text></g><g><rect x="506" y="252" width="68" height="28" rx="14" fill-opacity="0.15" stroke-width="1.5" stroke-dasharray="4 3" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><text x="540" y="271" text-anchor="middle" font-weight="600" style="fill: var(--text-primary);">A₁</text></g><g><rect x="618" y="250" width="84" height="32" rx="8" fill-opacity="0.25" stroke-width="1.5" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="660" y="271" text-anchor="middle" font-weight="600" style="fill: var(--text-primary);">P3</text></g><line x1="222" x2="264" y1="266" y2="266" stroke-width="1.5" marker-end="url(#lv-a)" style="stroke: var(--chart-axis);"></line><line x1="334" x2="376" y1="266" y2="266" stroke-width="1.5" marker-end="url(#lv-a)" style="stroke: var(--chart-axis);"></line><line x1="462" x2="504" y1="266" y2="266" stroke-width="1.5" marker-end="url(#lv-a)" style="stroke: var(--chart-axis);"></line><line x1="574" x2="616" y1="266" y2="266" stroke-width="1.5" marker-end="url(#lv-a)" style="stroke: var(--chart-axis);"></line><text x="180" y="300" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">writes A₀</text><text x="420" y="300" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">reads A₀, writes A₁</text><text x="660" y="300" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">reads A₁</text></g></svg>