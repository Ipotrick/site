h="1.5" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></circle><text x="220" y="456" text-anchor="middle" font-size="11" font-weight="600" style="fill: var(--text-primary);">W</text><text x="340" y="456" text-anchor="middle" font-size="11" font-weight="600" style="fill: var(--text-primary);">R</text><text x="460" y="456" text-anchor="middle" font-size="11" font-weight="600" style="fill: var(--text-primary);">W</text><text x="340" y="492" text-anchor="middle" font-size="11" font-weight="600" style="fill: var(--text-primary);">W</text><text x="460" y="492" text-anchor="middle" font-size="11" font-weight="600" style="fill: var(--text-primary);">R</text></g></svg>