<svg viewBox="0 0 760 516" role="img" aria-label="Batching moves the depth barrier before Water up to the hiz barrier before Cull. The timelines stay the same, only shoved together." font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" width="760" height="516"><style>svg{--chart-axis:rgb(195, 194, 183);--text-primary:rgb(11, 11, 11);--text-secondary:rgb(82, 81, 78);--chart-grid:rgba(11,11,11,0.1);--chart-categorical-1:rgb(42, 120, 214);--chart-categorical-2:rgb(235, 104, 52)}@media (prefers-color-scheme:dark){svg{--chart-axis:rgb(56, 56, 53);--text-primary:rgb(240, 239, 236);--text-secondary:rgb(195, 194, 183);--chart-grid:rgba(255,255,255,0.1);--chart-categorical-1:rgb(57, 135, 229);--chart-categorical-2:rgb(217, 89, 38)}}</style><defs><marker id="move-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill: var(--chart-axis);"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" style="fill: var(--text-primary);">The barrier example, as late as possible and batched</text><text x="24" y="50" font-size="11.5" style="fill: var(--text-secondary);">The example from generating barriers. W = write, R = read.</text><g><text x="24" y="94" style="fill: var(--text-primary);">As late as possible</text><text x="24" y="110" font-size="11.5" style="fill: var(--text-secondary);">3 barriers</text><rect x="180" y="80" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="300" y="80" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="420" y="80" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="540" y="80" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="275" y="80" width="10" height="32" rx="3" style="fill: var(--chart-axis);"></rect><rect x="395" y="80" width="10" height="32" rx="3" style="fill: var(--chart-axis);"></rect><rect x="515" y="80" width="10" height="32" rx="3" style="fill: var(--chart-axis);"></rect><text x="220" y="101" text-anchor="middle" style="fill: var(--text-primary);">GBuf</text><text x="340" y="101" text-anchor="middle" style="fill: var(--text-primary);">HiZ</text><text x="460" y="101" text-anchor="middle" style="fill: var(--text-primary);">Cull</text><text x="580" y="101" text-anchor="middle" style="fill: var(--text-primary);">Water</text><text x="280" y="128" text-anchor="middle" font-size="11.5" style="fill: var(--text-primary);">depth</text><text x="400" y="128" text-anchor="middle" font-size="11.5" style="fill: var(--text-primary);">hiz</text><text x="520" y="128" text-anchor="middle" font-size="11.5" style="fill: var(--text-primary);">depth</text><path d="M520 76V66H400V75" fill="none" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#move-arrow)" style="stroke: var(--chart-axis);"></path><text x="460" y="60" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">Water only needs HiZ, so it can move up</text></g><g><text x="24" y="162" font-size="11.5" style="fill: var(--text-secondary);">Resource timelines</text><text x="24" y="192" style="fill: var(--text-primary);">depth</text><text x="24" y="228" style="fill: var(--text-primary);">hiz</text><line x1="170" x2="640" y1="188" y2="188" stroke-width="2" style="stroke: var(--chart-grid);"></line><line x1="170" x2="640" y1="224" y2="224" stroke-width="2" style="stroke: var(--chart-grid);"></line><circle cx="220" cy="188" r="13" fill-opacity="0.15" stroke-width="1.5" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></circle><circle cx="340" cy="188" r="13" fill-opacity="0.15" stroke-width="1.5" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></circle><circle cx="580" cy="188" r="13" fill-opacity="0.15" stroke-width="1.5" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></circle><circle cx="340" cy="224" r="13" fill-opacity="0.15" stroke-width="1.5" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></circle><circle cx="460" cy="224" r="13" fill-opacity="0.15" stroke-width="1.5" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></circle><text x="220" y="192" text-anchor="middle" font-size="11" font-weight="600" style="fill: var(--text-primary);">W</text><text x="340" y="192" text-anchor="middle" font-size="11" font-weight="600" style="fill: var(--text-primary);">R</text><text x="580" y="192" text-anchor="middle" font-size="11" font-weight="600" style="fill: var(--text-primary);">W</text><text x="340" y="228" text-anchor="middle" font-size="11" font-weight="600" style="fill: var(--text-primary);">W</text><text x="460" y="228" text-anchor="middle" font-size="11" font-weight="600" style="fill: var(--text-primary);">R</text></g><g><text x="24" y="334" style="fill: var(--text-primary);">Batched</text><text x="24" y="350" font-size="11.5" style="fill: var(--text-secondary);">2 barriers</text><text x="220" y="294" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">Batch 0</text><text x="340" y="294" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">Batch 1</text><text x="460" y="294" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">Batch 2</text><rect x="180" y="304" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="300" y="304" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="420" y="304" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="420" y="344" width="80" height="3