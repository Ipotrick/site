<svg viewBox="0 0 760 620" role="img" aria-label="The main queue drains at its barriers while a long async compute pass keeps running. The async work fills the GPU during the drains, and together the bandwidth heavy main work and the ALU heavy async work use more of the hardware than either alone." font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" width="760" height="620"><style>svg{--text-primary:rgb(11, 11, 11);--text-secondary:rgb(82, 81, 78);--chart-categorical-1:rgb(42, 120, 214);--chart-status-warning:rgb(250, 178, 25);--chart-categorical-2:rgb(235, 104, 52);--chart-grid:rgba(11,11,11,0.1);--chart-status-good:rgb(12, 163, 12);--chart-categorical-3:rgb(27, 175, 122);--chart-axis:rgb(195, 194, 183)}@media (prefers-color-scheme:dark){svg{--text-primary:rgb(240, 239, 236);--text-secondary:rgb(195, 194, 183);--chart-categorical-1:rgb(57, 135, 229);--chart-status-warning:rgb(250, 178, 25);--chart-categorical-2:rgb(217, 89, 38);--chart-grid:rgba(255,255,255,0.1);--chart-status-good:rgb(12, 163, 12);--chart-categorical-3:rgb(25, 158, 112);--chart-axis:rgb(56, 56, 53)}}</style><text x="24" y="30" font-size="15" font-weight="600" style="fill: var(--text-primary);">Main queue and async queue</text><text x="24" y="50" font-size="11.5" style="fill: var(--text-secondary);">Illustrative. Main queue: bandwidth heavy passes with barriers. Async queue: one long, ALU heavy compute pass.</text><g><text x="24" y="84" font-weight="600" style="fill: var(--text-primary);">Execution</text><text x="24" y="119" font-size="11.5" style="fill: var(--text-primary);">Main queue</text><text x="24" y="159" font-size="11.5" style="fill: var(--text-primary);">Async queue</text><g><rect x="190" y="104" width="148.39999999999998" height="22" rx="5" fill-opacity="0.3" stroke-width="1.5" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="198" y="119" font-size="11.5" style="fill: var(--text-primary);">G-buffer</text></g><g><rect x="364.9" y="104" width="143.10000000000002" height="22" rx="5" fill-opacity="0.3" stroke-width="1.5" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="372.9" y="119" font-size="11.5" style="fill: var(--text-primary);">Post A</text></g><g><rect x="545.1" y="104" width="137.80000000000007" height="22" rx="5" fill-opacity="0.3" stroke-width="1.5" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="553.1" y="119" font-size="11.5" style="fill: var(--text-primary);">Post B</text></g><rect x="348.65" y="98" width="6" height="34" rx="2" fill-opacity="0.6" style="fill: var(--chart-status-warning); stroke: var(--chart-status-warning);"></rect><rect x="526.2" y="98" width="6" height="34" rx="2" fill-opacity="0.6" style="fill: var(--chart-status-warning); stroke: var(--chart-status-warning);"></rect><text x="351.65" y="92" text-anchor="middle" font-size="11" style="fill: var(--text-primary);">barrier</text><text x="529.2" y="92" text-anchor="middle" font-size="11" style="fill: var(--text-primary);">barrier</text><g><rect x="200.6" y="144" width="508.79999999999995" height="22" rx="5" fill-opacity="0.3" stroke-width="1.5" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><text x="208.6" y="159" font-size="11.5" style="fill: var(--text-primary);">Lighting (async compute)</text></g></g><g><text x="24" y="206" font-weight="600" style="fill: var(--text-primary);">Occupancy</text><line x1="190" x2="720" y1="312" y2="312" style="stroke: var(--chart-grid);"></line><line x1="190" x2="720" y1="216" y2="216" stroke-dasharray="2 3" style="stroke: var(--chart-grid);"></line><text x="184" y="220" text-anchor="end" font-size="10.5" style="fill: var(--text-secondary);">full</text><path d="M190 312L205.9 244.8L322.5 244.8L349 312L364.9 312L380.79999999999995 244.8L492.09999999999997 244.8L518.6 312L545.1 312L561 244.8L667 244.8L693.5 312Z" fill-opacity="0.35" stroke-width="1.25" stroke-linejoin="round" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></path><path d="M200.6 267.2L216.5 216L322.5 216L349 230.4L364.9 230.4L380.79999999999995 216L492.09999999999997 216L518.6 230.4L545.1 230.4L561 216L667 216L693.5 230.4L698.8 230.4L709.4 312L693.5 312L667 244.8L561 244.8L545.1 312L518.6 312L492.09999999999997 244.8L380.79999999999995 244.8L364.9 312L349 312L322.5 244.8L216.5 244.8L205.9 244.8Z" fill-opacity="0.35" stroke-width="1.25" stroke-linejoin="round" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></path><text x="24" y="280" font-size="11.5" style="fill: var(--chart-categorical-1);">main queue</text><text x="24" y="236" font-size="11.5" style="fill: var(--chart-categorical-2);">async queue</text><text x="356.95" y="336" text-anchor="middle" font-size="11" font-weight="600" style="fill: var(--chart-status-good);">async fills</text><text x="356.95" y="350" text-anchor="middle" font-size="11" font-weight="600" style="fill: var(--chart-status-good);">the drain</text><text x="531.85" y="336" text-anchor="middle" font-size="11" font-weight="600" style="fill: var(--chart-status-good);">async fills</text><text x="531.85" y="350" text-anchor="middle" font-size="11" font-weight="600" style="fill: var(--chart-status-good);">the drain</text></g><g><text x="24" y="396" font-weight="600" style="fill: var(--text-primary);">Hardware utilization</text><rect x="24" y="410" width="12" height="10" rx="2" fill-opacity="0.4" style="fill: var(--chart-categorical-3); stroke: var(--chart-categorical-3);"></rect><text x="42" y="419" font-size="11.5" style="fill: var(--text-primary);">ALU</text><rect x="24" y="428" width="12" height="10" rx="2" fill-opacity="0.4" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="42" y="437" font-size="11.5" style="fill: var(--text-primary);">bandwidth</text><line x1="200" x2="720" y1="560" y2="560" style="stroke: var(--chart-axis);"></line><line x1="200" x2="720" y1="430" y2="430" stroke-dasharray="2 3" style="stroke: var(--chart-grid);"></line><text x="194" y="434" text-anchor="end" font-size="10.5" style="fill: var(--text-secondary);">100%</text><g><rect x="246" y="521" width="40" height="39" rx="3" fill-opacity="0.4" style="fill: var(--chart-categorical-3); stroke: var(--chart-categorical-3);"></rect><rect x="294" y="456" width="40" height="104" rx="3" fill-opacity="0.4" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="290" y="578" text-anchor="middle" font-size="11.5" style="fill: var(--text-primary);">Main queue alone</text></g><g><rect x="411" y="469" width="40" height="91" rx="3" fill-opacity="0.4" style="fill: var(--chart-categorical-3); stroke: var(--chart-categorical-3);"></rect><rect x="459" y="540.5" width="40" height="19.5" rx="3" fill-opacity="0.4" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="455" y="578" text-anchor="middle" font-size="11.5" style="fill: var(--text-primary);">Async queue alone</text></g><g><rect x="576" y="443" width="40" height="117" rx="3" fill-opacity="0.4" style="fill: var(--chart-categorical-3); stroke: var(--chart-categorical-3);"></rect><rect x="624" y="443" width="40" height="117" rx="3" fill-opacity="0.4" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="620" y="578" text-anchor="middle" font-size="11.5" style="fill: var(--text-primary);">Both together</text></g><text x="620" y="420" text-anchor="middle" font-size="11" font-weight="600" style="fill: var(--chart-status-good);">both units busy</text></g></svg>