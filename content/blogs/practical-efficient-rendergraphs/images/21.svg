<svg viewBox="0 0 760 380" role="img" aria-label="HiZ and SSR read depth as one group, but land in batches 1 and 2. The barrier goes before the min, batch 1, and Water writing depth waits for the max, batch 2, and goes into batch 3." font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" width="760" height="380"><style>svg{--text-primary:rgb(11, 11, 11);--text-secondary:rgb(82, 81, 78);--chart-axis:rgb(195, 194, 183);--chart-grid:rgba(11,11,11,0.1);--chart-categorical-1:rgb(42, 120, 214);--chart-categorical-2:rgb(235, 104, 52);--chart-status-good:rgb(12, 163, 12)}@media (prefers-color-scheme:dark){svg{--text-primary:rgb(240, 239, 236);--text-secondary:rgb(195, 194, 183);--chart-axis:rgb(56, 56, 53);--chart-grid:rgba(255,255,255,0.1);--chart-categorical-1:rgb(57, 135, 229);--chart-categorical-2:rgb(217, 89, 38);--chart-status-good:rgb(12, 163, 12)}}</style><text x="24" y="30" font-size="15" font-weight="600" style="fill: var(--text-primary);">Scheduling a read group</text><text x="24" y="50" font-size="11.5" style="fill: var(--text-secondary);">GBuf writes depth, HiZ reads depth and writes hiz, SSR reads depth and hiz, Water writes depth</text><g><text x="24" y="100" font-weight="600" style="fill: var(--text-primary);">Recording order</text><g><rect x="180" y="80" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><text x="220" y="101" text-anchor="middle" style="fill: var(--text-primary);">GBuf</text></g><g><rect x="320" y="80" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><text x="360" y="101" text-anchor="middle" style="fill: var(--text-primary);">HiZ</text></g><g><rect x="460" y="80" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><text x="500" y="101" text-anchor="middle" style="fill: var(--text-primary);">SSR</text></g><g><rect x="600" y="80" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><text x="640" y="101" text-anchor="middle" style="fill: var(--text-primary);">Water</text></g></g><g><text x="24" y="164" style="fill: var(--text-primary);">depth</text><text x="24" y="200" style="fill: var(--text-primary);">hiz</text><line x1="160" x2="700" y1="160" y2="160" stroke-width="2" style="stroke: var(--chart-grid);"></line><line x1="160" x2="700" y1="196" y2="196" stroke-width="2" style="stroke: var(--chart-grid);"></line><g><circle cx="220" cy="160" r="14" fill-opacity="0.15" stroke-width="1.5" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></circle><text x="220" y="164" text-anchor="middle" font-size="11" font-weight="600" style="fill: var(--text-primary);">W</text></g><rect x="344" y="146" width="172" height="28" rx="14" fill-opacity="0.15" stroke-width="1.5" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="430" y="164" text-anchor="middle" font-size="11" font-weight="600" style="fill: var(--text-primary);">R group</text><g><circle cx="640" cy="160" r="14" fill-opacity="0.15" stroke-width="1.5" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></circle><text x="640" y="164" text-anchor="middle" font-size="11" font-weight="600" style="fill: var(--text-primary);">W</text></g><g><circle cx="360" cy="196" r="14" fill-opacity="0.15" stroke-width="1.5" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></circle><text x="360" y="200" text-anchor="middle" font-size="11" font-weight="600" style="fill: var(--text-primary);">W</text></g><g><circle cx="500" cy="196" r="14" fill-opacity="0.15" stroke-width="1.5" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></circle><text x="500" y="200" text-anchor="middle" font-size="11" font-weight="600" style="fill: var(--text-primary);">R</text></g></g><g><text x="24" y="294" font-weight="600" style="fill: var(--text-primary);">Scheduled</text><text x="220" y="256" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">Batch 0</text><text x="360" y="256" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">Batch 1</text><text x="500" y="256" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">Batch 2</text><text x="640" y="256" text-anchor="middle" font-size="11.5" style="fill: var(--text-secondary);">Batch 3</text><g><rect x="180" y="274" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><text x="220" y="295" text-anchor="middle" style="fill: var(--text-primary);">GBuf</text></g><rect x="284" y="268" width="12" height="44" rx="3" fill-opacity="0.35" stroke-width="1.25" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><g><rect x="320" y="274" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><text x="360" y="295" text-anchor="middle" style="fill: var(--text-primary);">HiZ</text></g><rect x="424" y="268" width="12" height="44" rx="3" fill-opacity="0.35" stroke-width="1.25" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><g><rect x="460" y="274" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><text x="500" y="295" text-anchor="middle" style="fill: var(--text-primary);">SSR</text></g><rect x="564" y="268" width="12" height="44" rx="3" fill-opacity="0.35" stroke-width="1.25" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><g><rect x="600" y="274" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><text x="640" y="295" text-anchor="middle" style="fill: var(--text-primary);">Water</text></g><rect x="296" y="314" width="268" height="22" rx="11" fill-opacity="0.1" stroke-dasharray="4 3" style="fill: var(--chart-status-good); stroke: var(--chart-status-good);"></rect><text x="430" y="329" text-anchor="middle" font-size="11.5" style="fill: var(--text-primary);">read group on depth: min batch 1, max batch 2</text><text x="290" y="358" text-anchor="middle" font-size="11" style="fill: var(--text-secondary);">depth barrier before the min</text><text x="570" y="358" text-anchor="middle" font-size="11" style="fill: var(--text-secondary);">Water waits for the max</text></g></svg>