<svg viewBox="0 0 760 464" role="img" aria-label="Two independent chains: their timelines, batched in recording order with two barriers, and reordered with one barrier" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" width="760" height="464"><style>svg{--text-primary:rgb(11, 11, 11);--text-secondary:rgb(82, 81, 78);--chart-axis:rgb(195, 194, 183);--chart-grid:rgba(11,11,11,0.1);--chart-categorical-1:rgb(42, 120, 214);--chart-categorical-2:rgb(235, 104, 52)}@media (prefers-color-scheme:dark){svg{--text-primary:rgb(240, 239, 236);--text-secondary:rgb(195, 194, 183);--chart-axis:rgb(56, 56, 53);--chart-grid:rgba(255,255,255,0.1);--chart-categorical-1:rgb(57, 135, 229);--chart-categorical-2:rgb(217, 89, 38)}}</style><text x="24" y="30" font-size="15" font-weight="600" style="fill: var(--text-primary);">Two independent chains, batched and reordered</text><text x="24" y="50" font-size="11.5" style="fill: var(--text-secondary);">Two independent chains: GBuf and AO on the gbuffer, Cull and Shadow on the light list. W = write, R = read.</text><g><text x="24" y="100" style="fill: var(--text-primary);">Recording order</text><rect x="180" y="80" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="300" y="80" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="420" y="80" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="540" y="80" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><text x="220" y="101" text-anchor="middle" style="fill: var(--text-primary);">GBuf</text><text x="340" y="101" text-anchor="middle" style="fill: var(--text-primary);">AO</text><text x="460" y="101" text-anchor="middle" style="fill: var(--text-primary);">Cull</text><text x="580" y="101" text-anchor="middle" style="fill: var(--text-primary);">Shadow</text></g><g><line x1="220" x2="220" y1="112" y2="149" stroke-dasharray="3 3" style="stroke: var(--chart-grid);"></line><line x1="340" x2="340" y1="112" y2="149" stroke-dasharray="3 3" style="stroke: var(--chart-grid);"></line><line x1="460" x2="460" y1="112" y2="189" stroke-dasharray="3 3" style="stroke: var(--chart-grid);"></line><line x1="580" x2="580" y1="112" y2="189" stroke-dasharray="3 3" style="stroke: var(--chart-grid);"></line><line x1="170" x2="640" y1="164" y2="164" stroke-width="2" style="stroke: var(--chart-grid);"></line><line x1="170" x2="640" y1="204" y2="204" stroke-width="2" style="stroke: var(--chart-grid);"></line><text x="24" y="168" style="fill: var(--text-primary);">gbuffer</text><text x="24" y="208" style="fill: var(--text-primary);">light_list</text><circle cx="220" cy="164" r="15" fill-opacity="0.15" stroke-width="1.5" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></circle><circle cx="340" cy="164" r="15" fill-opacity="0.15" stroke-width="1.5" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></circle><circle cx="460" cy="204" r="15" fill-opacity="0.15" stroke-width="1.5" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></circle><circle cx="580" cy="204" r="15" fill-opacity="0.15" stroke-width="1.5" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></circle><text x="220" y="168" text-anchor="middle" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">W</text><text x="340" y="168" text-anchor="middle" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">R</text><text x="460" y="208" text-anchor="middle" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">W</text><text x="580" y="208" text-anchor="middle" font-size="11.5" font-weight="600" style="fill: var(--text-primary);">R</text></g><g><text x="24" y="274" style="fill: var(--text-primary);">Batched in</text><text x="24" y="290" style="fill: var(--text-primary);">recording order</text><text x="24" y="306" font-size="11.5" style="fill: var(--text-secondary);">3 batches, 2 barriers</text><rect x="180" y="260" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="300" y="260" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="300" y="300" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="420" y="260" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="275" y="260" width="10" height="32" rx="3" style="fill: var(--chart-axis);"></rect><rect x="395" y="260" width="10" height="72" rx="3" style="fill: var(--chart-axis);"></rect><text x="220" y="281" text-anchor="middle" style="fill: var(--text-primary);">GBuf</text><text x="340" y="281" text-anchor="middle" style="fill: var(--text-primary);">AO</text><text x="340" y="321" text-anchor="middle" style="fill: var(--text-primary);">Cull</text><text x="460" y="281" text-anchor="middle" style="fill: var(--text-primary);">Shadow</text></g><g><text x="24" y="390" style="fill: var(--text-primary);">Reordered</text><text x="24" y="406" font-size="11.5" style="fill: var(--text-secondary);">2 batches, 1 barrier</text><rect x="180" y="376" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="180" y="416" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="300" y="376" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="300" y="416" width="80" height="32" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--chart-axis);"></rect><rect x="275" y="376" width="10"