<svg viewBox="0 0 760 520" role="img" aria-label="Overlapping two independent passes keeps the GPU full and finishes earlier than running them one after another" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" width="760" height="520"><text x="24" y="30" font-size="15" font-weight="600" fill="rgb(11, 11, 11)">Two independent passes, overlapped and one after another</text><text x="24" y="50" font-size="11.5" fill="rgb(82, 81, 78)">Illustrative. Bars are groups of threads, the strip below each row is how full the GPU is, by pass.</text><g><rect x="190" y="64" width="14" height="10" rx="2" fill="rgb(42, 120, 214)" fill-opacity="0.35" stroke="rgb(42, 120, 214)"></rect><text x="210" y="73" font-size="11.5" fill="rgb(11, 11, 11)">pass 1</text><rect x="270" y="64" width="14" height="10" rx="2" fill="rgb(235, 104, 52)" fill-opacity="0.35" stroke="rgb(235, 104, 52)"></rect><text x="290" y="73" font-size="11.5" fill="rgb(11, 11, 11)">pass 2</text></g><g><text x="24" y="146" font-weight="600" fill="rgb(11, 11, 11)">Overlapped</text><text x="24" y="164" font-size="11.5" fill="rgb(82, 81, 78)">pass 2 fills the GPU</text><text x="24" y="180" font-size="11.5" fill="rgb(82, 81, 78)">while pass 1 drains</text><rect x="190" y="96" width="212" height="12" rx="3" fill="rgb(42, 120, 214)" fill-opacity="0.3" stroke="rgb(42, 120, 214)" stroke-width="1.25"></rect><rect x="205.9" y="112" width="222.6" height="12" rx="3" fill="rgb(42, 120, 214)" fill-opacity="0.3" stroke="rgb(42, 120, 214)" stroke-width="1.25"></rect><rect x="216.5" y="128" width="174.89999999999998" height="12" rx="3" fill="rgb(42, 120, 214)" fill-opacity="0.3" stroke="rgb(42, 120, 214)" stroke-width="1.25"></rect><rect x="232.4" y="144" width="211.99999999999997" height="12" rx="3" fill="rgb(42, 120, 214)" fill-opacity="0.3" stroke="rgb(42, 120, 214)" stroke-width="1.25"></rect><rect x="349" y="160" width="212" height="12" rx="3" fill="rgb(235, 104, 52)" fill-opacity="0.3" stroke="rgb(235, 104, 52)" stroke-width="1.25"></rect><rect x="364.9" y="176" width="206.69999999999993" height="12" rx="3" fill="rgb(235, 104, 52)" fill-opacity="0.3" stroke="rgb(235, 104, 52)" stroke-width="1.25"></rect><rect x="380.79999999999995" y="192" width="169.60000000000014" height="12" rx="3" fill="rgb(235, 104, 52)" fill-opacity="0.3" stroke="rgb(235, 104, 52)" stroke-width="1.25"></rect><rect x="402" y="208" width="185.5" height="12" rx="3" fill="rgb(235, 104, 52)" fill-opacity="0.3" stroke="rgb(235, 104, 52)" stroke-width="1.25"></rect><g><line x1="190" x2="720" y1="266" y2="266" stroke="rgba(11,11,11,0.1)"></line><line x1="190" x2="720" y1="236" y2="236" stroke="rgba(11,11,11,0.1)" stroke-dasharray="2 3"></line><text x="184" y="240" text-anchor="end" font-size="10.5" fill="rgb(82, 81, 78)">full</text></g><path d="M190 266L232.4 236L349 236L444.4 266Z" fill="rgb(42, 120, 214)" fill-opacity="0.35" stroke="rgb(42, 120, 214)" stroke-width="1.25" stroke-linejoin="round"></path><path d="M349 236L550.4000000000001 236L587.5 266L444.4 266Z" fill="rgb(235, 104, 52)" fill-opacity="0.35" stroke="rgb(235, 104, 52)" stroke-width="1.25" stroke-linejoin="round"></path><line x1="587.5" x2="587.5" y1="88" y2="270" stroke="rgb(12, 163, 12)" stroke-width="1.5" stroke-dasharray="4 3"></line><text x="593.5" y="96" font-size="11.5" font-weight="600" fill="rgb(12, 163, 12)">done</text></g><g><text x="24" y="350" font-weight="600" fill="rgb(11, 11, 11)">One after another</text><text x="24" y="368" font-size="11.5" fill="rgb(82, 81, 78)">the GPU drains and</text><text x="24" y="384" font-size="11.5" fill="rgb(82, 81, 78)">fills up again</text><rect x="190" y="300" width="212" height="12" rx="3" fill="rgb(42, 120, 214)" fill-opacity="0.3" stroke="rgb(42, 120, 214)" stroke-width="1.25"></rect><rect x="205.9" y="316" width="222.6" height="12" rx="3" fill="rgb(42, 120, 214)" fill-opacity="0.3" stroke="rgb(42, 120, 214)" stroke-width="1.25"></rect><rect x="216.5" y="332" width="174.89999999999998" height="12" rx="3" fill="rgb(42, 120, 214)" fill-opacity="0.3" stroke="rgb(42, 120, 214)" stroke-width="1.25"></rect><rect x="232.4" y="348" width="211.99999999999997" height="12" rx="3" fill="rgb(42, 120, 214)" fill-opacity="0.3" stroke="rgb(42, 120, 214)" stroke-width="1.25"></rect><rect x="455" y="364" width="212" height="12" rx="3" fill="rgb(235, 104, 52)" fill-opacity="0.3" stroke="rgb(235, 104, 52)" stroke-width="1.25"></rect><rect x="470.90000000000003" y="380" width="222.59999999999997" height="12" rx="3" fill="rgb(235, 104, 52)" fill-opacity="0.3" stroke="rgb(235, 104, 52)" stroke-width="1.25"></rect><rect x="481.5" y="396" width="174.89999999999998" height="12" rx="3" fill="rgb(235, 104, 52)" fill-opacity="0.3" stroke="rgb(235, 104, 52)" stroke-width="1.25"></rect><rect x="497.4" y="412" width="212" height="12" rx="3" fill="rgb(235, 104, 52)" fill-opacity="0.3" stroke="rgb(235, 104, 52)" stroke-width="1.25"></rect><g><line x1="190" x2="720" y1="470" y2="470" stroke="rgba(11,11,11,0.1)"></line><line x1="190" x2="720" y1="440" y2="440" stroke="rgba(11,11,11,0.1)" stroke-dasharray="2 3"></line><text x="184" y="444" text-anchor="end" font-size="10.5" fill="rgb(82, 81, 78)">full</text></g><path d="M190 470L232.4 440L391.4 440L444.4 470Z" fill="rgb(42, 120, 214)" fill-opacity="0.35" stroke="rgb(42, 120, 214)" stroke-width="1.25" stroke-linejoin="round"></path><path d="M455 470L497.4 440L656.4 440L709.4 470Z" fill="rgb(235, 104, 52)" fill-opacity="0.35" stroke="rgb(235, 104, 52)" stroke-width="1.25" stroke-linejoin="round"></path><line x1="709.4" x2="709.4" y1="292" y2="474" stroke="rgb(82, 81, 78)" stroke-width="1.5" stroke-dasharray="4 3"></line><text x="703.4" y="300" text-anchor="end" font-size="11.5" font-weight="600" fill="rgb(82, 81, 78)">done</text></g><g><line x1="190" x2="720" y1="508" y2="508" stroke="rgb(195, 194, 183)" stroke-width="1.25"></line><text x="720" y="500" text-anchor="end" font-size="11.5" fill="rgb(82, 81, 78)">time</text></g></svg>