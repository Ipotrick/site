<svg viewBox="0 0 760 520" role="img" aria-label="Overlapping two independent passes keeps the GPU full and finishes earlier than running them one after another" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" width="760" height="520"><style>svg{--text-primary:rgb(11, 11, 11);--text-secondary:rgb(82, 81, 78);--chart-categorical-1:rgb(42, 120, 214);--chart-categorical-2:rgb(235, 104, 52);--chart-grid:rgba(11,11,11,0.1);--chart-status-good:rgb(12, 163, 12);--chart-axis:rgb(195, 194, 183)}@media (prefers-color-scheme:dark){svg{--text-primary:rgb(240, 239, 236);--text-secondary:rgb(195, 194, 183);--chart-categorical-1:rgb(57, 135, 229);--chart-categorical-2:rgb(217, 89, 38);--chart-grid:rgba(255,255,255,0.1);--chart-status-good:rgb(12, 163, 12);--chart-axis:rgb(56, 56, 53)}}</style><text x="24" y="30" font-size="15" font-weight="600" style="fill: var(--text-primary);">Two independent passes, overlapped and one after another</text><text x="24" y="50" font-size="11.5" style="fill: var(--text-secondary);">Illustrative. Bars are groups of threads, the strip below each row is how full the GPU is, by pass.</text><g><rect x="190" y="64" width="14" height="10" rx="2" fill-opacity="0.35" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="210" y="73" font-size="11.5" style="fill: var(--text-primary);">pass 1</text><rect x="270" y="64" width="14" height="10" rx="2" fill-opacity="0.35" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><text x="290" y="73" font-size="11.5" style="fill: var(--text-primary);">pass 2</text></g><g><text x="24" y="146" font-weight="600" style="fill: var(--text-primary);">Overlapped</text><text x="24" y="164" font-size="11.5" style="fill: var(--text-secondary);">pass 2 fills the GPU</text><text x="24" y="180" font-size="11.5" style="fill: var(--text-secondary);">while pass 1 drains</text><rect x="190" y="96" width="212" height="12" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><rect x="205.9" y="112" width="222.6" height="12" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><rect x="216.5" y="128" width="174.89999999999998" height="12" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><rect x="232.4" y="144" width="211.99999999999997" height="12" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><rect x="349" y="160" width="212" height="12" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><rect x="364.9" y="176" width="206.69999999999993" height="12" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><rect x="380.79999999999995" y="192" width="169.60000000000014" height="12" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><rect x="402" y="208" width="185.5" height="12" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><g><line x1="190" x2="720" y1="266" y2="266" style="stroke: var(--chart-grid);"></line><line x1="190" x2="720" y1="236" y2="236" stroke-dasharray="2 3" style="stroke: var(--chart-grid);"></line><text x="184" y="240" text-anchor="end" font-size="10.5" style="fill: var(--text-secondary);">full</text></g><path d="M190 266L193 265.6L196 264.5L199 262.8L202 260.5L208 254.5L217 244.8L221.5 240.6L224.5 238.5L227.5 237L230.5 236.1L353.5 236.2L365.5 238.2L382 244L418 260.7L430 264.3L440.5 265.9L444.4 26