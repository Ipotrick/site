<svg viewBox="0 0 760 284" role="img" aria-label="Scheduling in recording order gives three batches and two barriers" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" width="760" height="284"><style>svg{--text-primary:rgb(11, 11, 11);--chart-axis:rgb(195, 194, 183);--text-secondary:rgb(82, 81, 78);--chart-categorical-1:rgb(42, 120, 214)}@media (prefers-color-scheme:dark){svg{--text-primary:rgb(240, 239, 236);--chart-axis:rgb(56, 56, 53);--text-secondary:rgb(195, 194, 183);--chart-categorical-1:rgb(57, 135, 229)}}</style><text x="24" y="34" font-size="15" font-weight="600" style="fill: var(--text-primary);">Batching the barrier example in recording order</text><text x="460" y="72" text-anchor="middle" font-weight="600" style="fill: var(--text-primary);">Batch 0</text><text x="570" y="72" text-anchor="middle" font-weight="600" style="fill: var(--text-primary);">Batch 1</text><text x="680" y="72" text-anchor="middle" font-weight="600" style="fill: var(--text-primary);">Batch 2</text><g><rect x="510" y="100" width="10" height="160" rx="3" style="fill: var(--chart-axis);"></rect><rect x="620" y="100" width="10" height="160" rx="3" style="fill: var(--chart-axis);"></rect></g><text x="515" y="94" text-anchor="middle" font-size="11" style="fill: var(--text-primary);">depth</text><text x="625" y="94" text-anchor="middle" font-size="11" style="fill: var(--text-primary);">hiz + depth</text><g><text x="24" y="124" style="fill: var(--text-primary);">GBuf writes depth</text><text x="270" y="124" font-size="11.5" style="fill: var(--text-secondary);">starts batch 0</text><rect x="414" y="107" width="92" height="26" rx="8" fill-opacity="0.12" stroke-width="1.25" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="460" y="124" text-anchor="middle" style="fill: var(--text-primary);">GBuf</text></g><g><text x="24" y="164" style="fill: var(--text-primary);">HiZ reads depth, writes hiz</text><text x="270" y="164" font-size="11.5" style="fill: var(--text-secondary);">needs GBuf: new batch</text><rect x="524" y="147" width="92" height="26" rx="8" fill-opacity="0.12" stroke-width="1.25" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="570" y="164" text-anchor="middle" style="fill: var(--text-primary);">HiZ</text></g><g><text x="24" y="204" style="fill: var(--text-primary);">Cull reads hiz</text><text x="270" y="204" font-size="11.5" style="fill: var(--text-secondary);">needs HiZ: new batch</text><rect x="634" y="187" width="92" height="26" rx="8" fill-opacity="0.12" stroke-width="1.25" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="680" y="204" text-anchor="middle" style="fill: var(--text-primary);">Cull</text></g><g><text x="24" y="244" style="fill: var(--text-primary);">Water writes depth</text><text x="270" y="244" font-size="11.5" style="fill: var(--text-secondary);">only needs HiZ: joins</text><rect x="634" y="227" width="92" height="26" rx="8" fill-opacity="0.12" stroke-width="1.25" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="680" y="244" text-anchor="middle" style="fill: var(--text-primary);">Water</text></g></svg>