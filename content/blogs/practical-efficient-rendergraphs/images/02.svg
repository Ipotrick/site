<svg viewBox="0 0 760 440" role="img" aria-label="Without a barrier the reader overlaps the writer; with a barrier it waits" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" width="760" height="440"><style>svg{--text-primary:rgb(11, 11, 11);--text-secondary:rgb(82, 81, 78);--chart-categorical-1:rgb(42, 120, 214);--chart-categorical-2:rgb(235, 104, 52);--chart-status-critical:rgb(208, 59, 59);--chart-status-good:rgb(12, 163, 12);--chart-axis:rgb(195, 194, 183)}@media (prefers-color-scheme:dark){svg{--text-primary:rgb(240, 239, 236);--text-secondary:rgb(195, 194, 183);--chart-categorical-1:rgb(57, 135, 229);--chart-categorical-2:rgb(217, 89, 38);--chart-status-critical:rgb(208, 59, 59);--chart-status-good:rgb(12, 163, 12);--chart-axis:rgb(56, 56, 53)}}</style><text x="24" y="30" font-size="15" font-weight="600" style="fill: var(--text-primary);">A read after write, without and with a barrier</text><text x="24" y="50" font-size="11.5" style="fill: var(--text-secondary);">Illustrative GPU timeline, each bar is a group of threads. Pass 1 writes an image, pass 2 reads it.</text><g><rect x="190" y="64" width="14" height="10" rx="2" fill-opacity="0.3" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="210" y="73" font-size="11.5" style="fill: var(--text-primary);">pass 1 (writes)</text><rect x="320" y="64" width="14" height="10" rx="2" fill-opacity="0.3" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><text x="340" y="73" font-size="11.5" style="fill: var(--text-primary);">pass 2 (reads)</text></g><g><text x="24" y="150" font-weight="600" style="fill: var(--text-primary);">No barrier</text><rect x="349" y="94" width="95.39999999999998" height="136" fill-opacity="0.1" stroke-dasharray="4 3" style="fill: var(--chart-status-critical); stroke: var(--chart-status-critical);"></rect><rect x="190" y="100" width="212" height="12" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><rect x="205.9" y="116" width="222.6" height="12" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><rect x="216.5" y="132" width="174.89999999999998" height="12" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><rect x="232.4" y="148" width="211.99999999999997" height="12" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><rect x="349" y="164" width="212" height="12" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><rect x="364.9" y="180" width="206.69999999999993" height="12" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><rect x="380.79999999999995" y="196" width="169.60000000000014" height="12" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><rect x="402" y="212" width="185.5" height="12" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><text x="396.70000000000005" y="248" text-anchor="middle" font-size="11.5" font-weight="600" style="fill: var(--chart-status-critical);">hazard: reads data not yet written or flushed</text></g><g><text x="24" y="326" font-weight="600" style="fill: var(--text-primary);">With barrier</text><rect x="190" y="276" width="212" height="12" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><rect x="205.9" y="292" width="222.6" height="12" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><rect x="216.5" y="308" width="174.89999999999998" height="12" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><rect x="232.4" y="324" width="211.99999999999997" height="12" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><rect x="449.7" y="270" width="31.80000000000001" height="136" rx="3" fill-opacity="0.2" stroke-width="1.5" style="fill: var(--chart-status-good); stroke: var(--chart-status-good);"></rect><rect x="486.8" y="340" width="201.40000000000003" height="12" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><rect x="497.4" y="356" width="206.70000000000005" height="12" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><rect x="508" y="372" width="169.60000000000002" height="12" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><rect x="518.6" y="388" width="201.39999999999998" height="12" rx="3" fill-opacity="0.3" stroke-width="1.25" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><text x="465.6" y="424" text-anchor="middle" font-size="11.5" font-weight="600" style="fill: var(--chart-status-good);">barrier: wait for pass 1, flush its writes</text></g><g><line x1="190" x2="720" y1="428" y2="428" stroke-width="1.25" style="stroke: var(--chart-axis);"></line><text x="720" y="420" text-anchor="end" font-size="11.5" style="fill: var(--text-secondary);">time</text></g></svg>