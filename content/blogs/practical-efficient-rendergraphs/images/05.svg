<svg viewBox="0 0 760 450" role="img" aria-label="Two passes write different halves of the same buffer, shown first as memory. Over time, the driver cannot know the halves are separate and puts a barrier between the passes, so the GPU occupancy drains. Knowing the writes are safe, both passes can overlap and the occupancy stays full." font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" width="760" height="450"><style>svg{--text-primary:rgb(11, 11, 11);--text-secondary:rgb(82, 81, 78);--chart-categorical-1:rgb(42, 120, 214);--chart-categorical-2:rgb(235, 104, 52);--chart-status-critical:rgb(208, 59, 59);--chart-status-warning:rgb(250, 178, 25);--chart-status-good:rgb(12, 163, 12);--chart-grid:rgba(11,11,11,0.1);--chart-axis:rgb(195, 194, 183)}@media (prefers-color-scheme:dark){svg{--text-primary:rgb(240, 239, 236);--text-secondary:rgb(195, 194, 183);--chart-categorical-1:rgb(57, 135, 229);--chart-categorical-2:rgb(217, 89, 38);--chart-status-critical:rgb(208, 59, 59);--chart-status-warning:rgb(250, 178, 25);--chart-status-good:rgb(12, 163, 12);--chart-grid:rgba(255,255,255,0.1);--chart-axis:rgb(56, 56, 53)}}</style><defs><marker id="tm-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" style="fill: var(--text-secondary);"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" style="fill: var(--text-primary);">Two safe writes to one buffer</text><text x="24" y="50" font-size="11.5" style="fill: var(--text-secondary);">Top: where the passes write in memory. Below: what happens over time, and how full the GPU is.</text><rect x="24" y="64" width="250" height="80" rx="8" fill="none" stroke-width="1.25" stroke-dasharray="3 3" style="stroke: var(--chart-axis);"></rect><text x="36" y="82" font-size="11.5" font-weight="600" style="fill: var(--text-secondary);">The buffer, in memory</text><rect x="36" y="90" width="108" height="24" rx="4" fill-opacity="0.3" stroke-width="1.5" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><rect x="144" y="90" width="108" height="24" rx="4" fill-opacity="0.3" stroke-width="1.5" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><text x="90" y="106" text-anchor="middle" font-size="11.5" style="fill: var(--text-primary);">first half</text><text x="198" y="106" text-anchor="middle" font-size="11.5" style="fill: var(--text-primary);">second half</text><text x="36" y="132" font-size="11" style="fill: var(--text-secondary);">pass 1 writes one, pass 2 the other</text><text x="24" y="182" font-weight="600" style="fill: var(--text-primary);">Over time</text><line x1="250" x2="728" y1="178" y2="178" stroke-width="1.25" marker-end="url(#tm-ar)" style="stroke: var(--text-secondary);"></line><text x="734" y="182" font-size="11.5" style="fill: var(--text-secondary);">time</text><text x="24" y="226" font-weight="600" style="fill: var(--text-primary);">Driver guessing</text><text x="24" y="244" font-size="11.5" style="fill: var(--chart-status-critical);">sees two writes, serializes</text><g><rect x="250" y="210" width="197.4" height="24" rx="6" fill-opacity="0.3" stroke-width="1.5" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="258" y="226" font-size="12" style="fill: var(--text-primary);">Pass 1</text></g><rect x="459.85" y="202" width="8" height="40" rx="2" fill-opacity="0.5" style="fill: var(--chart-status-warning); stroke: var(--chart-status-warning);"></rect><g><rect x="480.3" y="210" width="197.4" height="24" rx="6" fill-opacity="0.3" stroke-width="1.5" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><text x="488.3" y="226" font-size="12" style="fill: var(--text-primary);">Pass 2</text></g><line x1="250" x2="730" y1="292" y2="292" style="stroke: var(--chart-grid);"></line><line x1="250" x2="730" y1="262" y2="262" stroke-dasharray="2 3" style="stroke: var(--chart-grid);"></line><text x="244" y="266" text-anchor="end" font-size="10.5" style="fill: var(--text-secondary);">full</text><path d="M250 292L253 291.6L256 290.5L259 288.7L272.5 277.6L275.5 275.8L278.5 274.5L281.5 274L416.5 274.1L419.5 274.7L422.5 276.1L427 279.2L437.5 288.1L440.5 290L443.5 291.3L447.4 292L447.4 292L443.5 292L440.5 292L437.5 292L427 292L422.5 292L419.5 292L416.5 292L281.5 292L278.5 292L275.5 292L272.5 292L259 292L256 292L253 292L250 292Z" fill-opacity="0.35" stroke-width="1.25" stroke-linejoin="round" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></path><path d="M480.3 292L483.3 291.6L486.3 290.5L489.3 288.7L502.8 277.6L505.8 275.8L508.8 274.5L511.8 274L646.8 274.1L649.8 274.7L652.8 276.1L657.3 279.2L667.8 288.1L670.8 290L673.8 291.3L677.7 292L677.7 292L673.8 292L670.8 292L667.8 292L657.3 292L652.8 292L649.8 292L646.8 292L511.8 292L508.8 292L505.8 292L502.8 292L489.3 292L486.3 292L483.3 292L480.3 292Z" fill-opacity="0.35" stroke-width="1.25" stroke-linejoin="round" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></path><text x="463.9" y="306" text-anchor="middle" font-size="11" font-weight="600" style="fill: var(--chart-status-critical);">GPU drains</text><line x1="677.7" x2="677.7" y1="200" y2="296" stroke-width="1.5" stroke-dasharray="4 3" style="stroke: var(--text-secondary);"></line><text x="683.7" y="226" font-size="11.5" style="fill: var(--text-secondary);">done</text><text x="24" y="352" font-weight="600" style="fill: var(--text-primary);">Known to be safe</text><text x="24" y="370" font-size="11.5" style="fill: var(--chart-status-good);">no barrier, both overlap</text><g><rect x="250" y="334" width="197.4" height="24" rx="6" fill-opacity="0.3" stroke-width="1.5" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="258" y="350" font-size="12" style="fill: var(--text-primary);">Pass 1</text></g><g><rect x="264.1" y="362" width="202.1" height="24" rx="6" fill-opacity="0.3" stroke-width="1.5" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><text x="272.1" y="378" font-size="12" style="fill: var(--text-primary);">Pass 2</text></g><line x1="250" x2="730" y1="434" y2="434" style="stroke: var(--chart-grid);"></line><line x1="250" x2="730" y1="404" y2="404" stroke-dasharray="2 3" style="stroke: var(--chart-grid);"></line><text x="244" y="408" text-anchor="end" font-size="10.5" style="fill: var(--text-secondary);">full</text><path d="M250 434L253 433.6L256 432.5L259 430.7L272.5 419.6L275.5 417.8L278.5 416.5L281.5 416L416.5 416.1L419.5 416.7L422.5 418.1L427 421.2L437.5 430.1L440.5 432L443.5 433.3L447.4 434L447.4 434L443.5 434L440.5 434L437.5 434L427 434L422.5 434L419.5 434L416.5 434L281.5 434L278.5 434L275.5 434L272.5 434L259 434L256 434L253 434L250 434Z" fill-opacity="0.35" stroke-width="1.25" stroke-linejoin="round" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></path><path d="M264.1 426.7L267.1 423.6L271.6 418L274.6 413.9L277.6 410L280.6 406.6L283.6 404L415.6 404L418.6 404L421.6 404L424.6 404L427.6 404L429.1 405L436.6 411.6L439.6 414.7L442.6 417.9L445.6 420.9L454.6 428.8L457.6 431L460.6 432.7L463.6 433.7L466.2 434L466.2 434L463.6 434L460.6 434L457.6 434L454.6 434L445.6 433.9L442.6 433L439.6 431.5L436.6 429.4L429.1 423L427.6 421.7L424.6 419.4L421.6 417.6L418.6 416.4L415.6 416L283.6 416L280.6 416.1L277.6 416.8L274.6 418.3L271.6 420.3L267.1 424L264.1 426.7Z" fill-opacity="0.35" stroke-width="1.25" stroke-linejoin="round" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></path><text x="358" y="448" text-anchor="middle" font-size="11" font-weight="600" style="fill: var(--chart-status-good);">GPU stays full</text><line x1="466.2" x2="466.2" y1="324" y2="438" stroke-width="1.5" stroke-dasharray="4 3" style="stroke: var(--chart-status-good);"></line><text x="472.2" y="350" font-size="11.5" font-weight="600" style="fill: var(--chart-status-good);">done much earlier</text></svg>