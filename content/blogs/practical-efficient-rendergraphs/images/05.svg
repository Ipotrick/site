<svg viewBox="0 0 760 300" role="img" aria-label="Two passes write different halves of the same buffer. The driver cannot know this and puts a barrier between them; knowing it is safe, both passes can overlap." font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" width="760" height="300"><style>svg{--text-primary:rgb(11, 11, 11);--text-secondary:rgb(82, 81, 78);--chart-categorical-1:rgb(42, 120, 214);--chart-categorical-2:rgb(235, 104, 52);--chart-status-critical:rgb(208, 59, 59);--chart-status-warning:rgb(250, 178, 25);--chart-status-good:rgb(12, 163, 12)}@media (prefers-color-scheme:dark){svg{--text-primary:rgb(240, 239, 236);--text-secondary:rgb(195, 194, 183);--chart-categorical-1:rgb(57, 135, 229);--chart-categorical-2:rgb(217, 89, 38);--chart-status-critical:rgb(208, 59, 59);--chart-status-warning:rgb(250, 178, 25);--chart-status-good:rgb(12, 163, 12)}}</style><text x="24" y="30" font-size="15" font-weight="600" style="fill: var(--text-primary);">Two safe writes to one buffer</text><text x="24" y="50" font-size="11.5" style="fill: var(--text-secondary);">Pass 1 writes the first half, pass 2 the second half. They never touch the same memory.</text><g><text x="24" y="92" font-weight="600" style="fill: var(--text-primary);">Buffer</text><rect x="250" y="76" width="235" height="26" rx="4" fill-opacity="0.3" stroke-width="1.5" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><rect x="485" y="76" width="235" height="26" rx="4" fill-opacity="0.3" stroke-width="1.5" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><text x="367.5" y="94" text-anchor="middle" font-size="12" style="fill: var(--text-primary);">written by pass 1</text><text x="602.5" y="94" text-anchor="middle" font-size="12" style="fill: var(--text-primary);">written by pass 2</text></g><g><text x="24" y="160" font-weight="600" style="fill: var(--text-primary);">Driver guessing</text><text x="24" y="178" font-size="11.5" style="fill: var(--chart-status-critical);">sees two writes, serializes</text><g><rect x="250" y="146" width="197.39999999999998" height="24" rx="6" fill-opacity="0.3" stroke-width="1.5" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="258" y="162" font-size="12" style="fill: var(--text-primary);">Pass 1</text></g><rect x="459.85" y="138" width="8" height="40" rx="2" fill-opacity="0.5" style="fill: var(--chart-status-warning); stroke: var(--chart-status-warning);"></rect><g><rect x="480.29999999999995" y="146" width="197.4000000000001" height="24" rx="6" fill-opacity="0.3" stroke-width="1.5" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><text x="488.29999999999995" y="162" font-size="12" style="fill: var(--text-primary);">Pass 2</text></g><line x1="677.7" x2="677.7" y1="136" y2="182" stroke-width="1.5" stroke-dasharray="4 3" style="stroke: var(--text-secondary);"></line><text x="683.7" y="162" font-size="11.5" style="fill: var(--text-secondary);">done</text></g><g><text x="24" y="238" font-weight="600" style="fill: var(--text-primary);">Known to be safe</text><text x="24" y="256" font-size="11.5" style="fill: var(--chart-status-good);">no barrier, both overlap</text><g><rect x="250" y="214" width="197.39999999999998" height="24" rx="6" fill-opacity="0.3" stroke-width="1.5" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="258" y="230" font-size="12" style="fill: var(--text-primary);">Pass 1</text></g><g><rect x="264.1" y="244" width="202.10000000000002" height="24" rx="6" fill-opacity="0.3" stroke-width="1.5" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><text x="272.1" y="260" font-size="12" style="fill: var(--text-primary);">Pass 2</text></g><line x1="466.20000000000005" x2="466.20000000000005" y1="206" y2="274" stroke-width="1.5" stroke-dasharray="4 3" style="stroke: var(--chart-status-good);"></line><text x="472.20000000000005" y="240" font-size="11.5" font-weight="600" style="fill: var(--chart-status-good);">done much earlier</text></g></svg>