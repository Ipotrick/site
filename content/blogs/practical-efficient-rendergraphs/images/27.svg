<svg viewBox="0 0 760 310" role="img" aria-label="Sorting the passes of one batch by kind reduces subchannel switches from four to two" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" width="760" height="310"><style>svg{--text-primary:rgb(11, 11, 11);--text-secondary:rgb(82, 81, 78);--chart-categorical-1:rgb(42, 120, 214);--chart-categorical-2:rgb(235, 104, 52);--chart-categorical-3:rgb(27, 175, 122);--chart-status-warning:rgb(250, 178, 25);--chart-axis:rgb(195, 194, 183)}@media (prefers-color-scheme:dark){svg{--text-primary:rgb(240, 239, 236);--text-secondary:rgb(195, 194, 183);--chart-categorical-1:rgb(57, 135, 229);--chart-categorical-2:rgb(217, 89, 38);--chart-categorical-3:rgb(25, 158, 112);--chart-status-warning:rgb(250, 178, 25);--chart-axis:rgb(56, 56, 53)}}</style><text x="24" y="30" font-size="15" font-weight="600" style="fill: var(--text-primary);">One batch, recorded order and sorted by kind</text><text x="24" y="50" font-size="11.5" style="fill: var(--text-secondary);">All five passes are in the same batch, so any order inside it is legal.</text><g><rect x="190" y="66" width="14" height="10" rx="2" fill-opacity="0.18" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><text x="210" y="75" font-size="11.5" style="fill: var(--text-primary);">graphics</text><rect x="280" y="66" width="14" height="10" rx="2" fill-opacity="0.18" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><text x="300" y="75" font-size="11.5" style="fill: var(--text-primary);">compute</text><rect x="370" y="66" width="14" height="10" rx="2" fill-opacity="0.18" style="fill: var(--chart-categorical-3); stroke: var(--chart-categorical-3);"></rect><text x="390" y="75" font-size="11.5" style="fill: var(--text-primary);">transfer</text><line x1="466" x2="466" y1="62" y2="80" stroke-width="2.5" stroke-dasharray="4 3" style="stroke: var(--chart-status-warning);"></line><text x="476" y="75" font-size="11.5" style="fill: var(--text-primary);">subchannel switch</text></g><g><text x="24" y="126" font-weight="600" style="fill: var(--text-primary);">Recorded order</text><text x="24" y="144" font-size="11.5" font-weight="600" style="fill: var(--chart-status-warning);">4 switches</text><rect x="178" y="96" width="544" height="68" rx="10" fill="none" stroke-dasharray="2 4" style="stroke: var(--chart-axis);"></rect><rect x="190" y="112" width="88" height="36" rx="8" fill-opacity="0.18" stroke-width="1.5" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><rect x="298" y="112" width="88" height="36" rx="8" fill-opacity="0.18" stroke-width="1.5" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><rect x="406" y="112" width="88" height="36" rx="8" fill-opacity="0.18" stroke-width="1.5" style="fill: var(--chart-categorical-3); stroke: var(--chart-categorical-3);"></rect><rect x="514" y="112" width="88" height="36" rx="8" fill-opacity="0.18" stroke-width="1.5" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><rect x="622" y="112" width="88" height="36" rx="8" fill-opacity="0.18" stroke-width="1.5" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><line x1="288" x2="288" y1="102" y2="158" stroke-width="2.5" stroke-dasharray="4 3" style="stroke: var(--chart-status-warning);"></line><line x1="396" x2="396" y1="102" y2="158" stroke-width="2.5" stroke-dasharray="4 3" style="stroke: var(--chart-status-warning);"></line><line x1="504" x2="504" y1="102" y2="158" stroke-width="2.5" stroke-dasharray="4 3" style="stroke: var(--chart-status-warning);"></line><line x1="612" x2="612" y1="102" y2="158" stroke-width="2.5" stroke-dasharray="4 3" style="stroke: var(--chart-status-warning);"></line><text x="234" y="135" text-anchor="middle" style="fill: var(--text-primary);">G1</text><text x="342" y="135" text-anchor="middle" style="fill: var(--text-primary);">C1</text><text x="450" y="135" text-anchor="middle" style="fill: var(--text-primary);">T1</text><text x="558" y="135" text-anchor="middle" style="fill: var(--text-primary);">G2</text><text x="666" y="135" text-anchor="middle" style="fill: var(--text-primary);">C2</text></g><g><text x="24" y="246" font-weight="600" style="fill: var(--text-primary);">Sorted by kind</text><text x="24" y="264" font-size="11.5" font-weight="600" style="fill: var(--chart-status-warning);">2 switches</text><rect x="178" y="216" width="544" height="68" rx="10" fill="none" stroke-dasharray="2 4" style="stroke: var(--chart-axis);"></rect><rect x="190" y="232" width="88" height="36" rx="8" fill-opacity="0.18" stroke-width="1.5" style="fill: var(--chart-categorical-3); stroke: var(--chart-categorical-3);"></rect><rect x="298" y="232" width="88" height="36" rx="8" fill-opacity="0.18" stroke-width="1.5" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><rect x="406" y="232" width="88" height="36" rx="8" fill-opacity="0.18" stroke-width="1.5" style="fill: var(--chart-categorical-2); stroke: var(--chart-categorical-2);"></rect><rect x="514" y="232" width="88" height="36" rx="8" fill-opacity="0.18" stroke-width="1.5" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><rect x="622" y="232" width="88" height="36" rx="8" fill-opacity="0.18" stroke-width="1.5" style="fill: var(--chart-categorical-1); stroke: var(--chart-categorical-1);"></rect><line x1="288" x2="288" y1="222" y2="278" stroke-width="2.5" stroke-dasharray="4 3" style="stroke: var(--chart-status-warning);"></line><line x1="504" x2="504" y1="222" y2="278" stroke-width="2.5" stroke-dasharray="4 3" style="stroke: var(--chart-status-warning);"></line><text x="234" y="255" text-anchor="middle" style="fill: var(--text-primary);">T1</text><text x="342" y="255" text-anchor="middle" style="fill: var(--text-primary);">C1</text><text x="450" y="255" text-anchor="middle" style="fill: var(--text-primary);">C2</text><text x="558" y="255" text-anchor="middle" style="fill: var(--text-primary);">G1</text><text x="666" y="255" text-anchor="middle" style="fill: var(--text-primary);">G2</text></g></svg>